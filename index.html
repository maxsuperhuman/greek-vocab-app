// ─── IndexedDB storage (PWA - reliable, never clears) ────────────
const DB_NAME = "greek_vocab_db";
const DB_STORE = "mastery";
const DB_KEY = "user_mastery";

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      e.target.result.createObjectStore(DB_STORE);
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = () => reject(req.error);
  });
}

async function supabaseLoad() {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, "readonly");
      const req = tx.objectStore(DB_STORE).get(DB_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch(e) {
    console.error("Load error:", e);
    return null;
  }
}

async function supabaseSave(mastery) {
  try {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(DB_STORE, "readwrite");
      tx.objectStore(DB_STORE).put(mastery, DB_KEY);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  } catch(e) {
    console.error("Save error:", e);
    return false;
  }
}

// ─── Claude API for interactive word cards ────────────────────────
const CARD_CACHE_PREFIX = "card_v3_";
const API_KEY_STORE = "api_key";

async function getApiKey() {
  try {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(DB_STORE, "readonly");
      const req = tx.objectStore(DB_STORE).get(API_KEY_STORE);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch { return null; }
}

async function saveApiKey(key) {
  try {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(DB_STORE, "readwrite");
      tx.objectStore(DB_STORE).put(key, API_KEY_STORE);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  } catch { return false; }
}


async function getCardFromCache(greek) {
  try {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(DB_STORE, "readonly");
      const req = tx.objectStore(DB_STORE).get(CARD_CACHE_PREFIX + greek);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch { return null; }
}

async function saveCardToCache(greek, card) {
  try {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(DB_STORE, "readwrite");
      tx.objectStore(DB_STORE).put(card, CARD_CACHE_PREFIX + greek);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  } catch { return false; }
}

async function fetchWordCard(greek, transcription, english, topic) {
  // Check cache first
  const cached = await getCardFromCache(greek);
  if (cached) return cached;

  const apiKey = await getApiKey();
  if (!apiKey) return null;

  const hasMeta = transcription && english;
  const prompt = `You are a Greek language teacher. Give a thorough but concise reference card for the Greek word "${greek}"${hasMeta ? ` (${transcription}) meaning "${english}"` : ""}${topic ? ` (topic: ${topic})` : ""}.
${hasMeta ? "" : `\nThe transliteration and English meaning were not provided — determine them yourself and include them as "headTr" and "headEn" in the JSON.\n`}
Return ONLY a JSON object with this exact structure:
{${hasMeta ? "" : `
  "headTr": "transliteration of \\"${greek}\\"",
  "headEn": "English meaning of \\"${greek}\\"",`}
  "pos": "part of speech (e.g. noun (neuter), verb, adjective)",
  "forms": "key grammatical forms as plain text, max 6 lines. If a VERB: conjugate PRESENT tense only, all 6 persons, format 'εγώ μιλάω (miláo)' one per line. If a NOUN: give the article + singular + plural with gender, e.g. 'το σπίτι (to spíti) — singular, neuter' / 'τα σπίτια (ta spítia) — plural'. If an ADJECTIVE: give masculine/feminine/neuter singular forms.",
  "wordFamily": [
    {"gr": "related Greek word sharing the same root", "tr": "transliteration", "en": "English meaning", "pos": "short part of speech tag e.g. noun/verb/adj"}
  ],
  "synonyms": [
    {"gr": "Greek synonym", "tr": "transliteration", "en": "English meaning"}
  ],
  "antonyms": [
    {"gr": "Greek antonym", "tr": "transliteration", "en": "English meaning"}
  ],
  "examples": [
    {"gr": "Greek sentence", "tr": "transliteration", "en": "English translation"},
    {"gr": "Greek sentence", "tr": "transliteration", "en": "English translation"},
    {"gr": "Greek sentence", "tr": "transliteration", "en": "English translation"}
  ],
  "notes": "1-2 sentences: cultural context, common mistakes, or usage tips"
}

Rules:
- wordFamily: 2-4 words sharing the same root/stem (different part of speech where possible). Empty array if genuinely none exist.
- synonyms: 0-3 close synonyms. Empty array if none.
- antonyms: 0-3 opposites. Empty array if none (most nouns/many words won't have one — that's fine, just return []).
- Use simple A2-level Greek in examples. Include negation or question form in one example.`;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: "claude-haiku-4-5",
        max_tokens: 1800,
        messages: [{ role: "user", content: prompt }]
      })
    });
    if (!res.ok) throw new Error("API error " + res.status);
    const data = await res.json();
    const text = data.content[0].text.trim();
    const jsonMatch = text.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error("No JSON");
    const card = parseCardJson(jsonMatch[0]);
    if (!card) throw new Error("Could not parse card JSON");
    await saveCardToCache(greek, card);
    return card;
  } catch(e) {
    console.error("Card fetch error:", e);
    return null;
  }
}

// Parses the card JSON returned by the model. Tolerates minor malformed
// JSON (e.g. a response that got cut off mid-array due to a token limit)
// by trying a straight parse first, then falling back to trimming the
// string back to the last complete top-level field before retrying.
function parseCardJson(raw) {
  try { return JSON.parse(raw); } catch(e) {}
  // Fallback: find the last complete "key": value pair (object or array close)
  // before the point of failure, and close the JSON there.
  let s = raw;
  for (let cut = s.length - 1; cut > 0; cut--) {
    const ch = s[cut];
    if (ch !== "}" && ch !== "]") continue;
    const candidate = s.slice(0, cut + 1).replace(/,\s*$/, "") + "}";
    try {
      const parsed = JSON.parse(candidate);
      if (parsed && typeof parsed === "object") return parsed;
    } catch(e) {}
  }
  return null;
}

// ─── Extra verb tense lookup (loaded on demand, separate small cache) ──
const TENSE_CACHE_PREFIX = "tense_v1_";
const TENSE_LABELS = {
  past: "Past tense (αόριστος)",
  future: "Future tense",
  imperative: "Imperative (προστακτική)"
};

async function getTenseFromCache(greek, tense) {
  try {
    const db = await openDB();
    const tx = db.transaction(DB_STORE, "readonly");
    const req = tx.objectStore(DB_STORE).get(TENSE_CACHE_PREFIX + tense + "_" + greek);
    return await new Promise(res => { req.onsuccess = () => res(req.result || null); req.onerror = () => res(null); });
  } catch { return null; }
}
async function saveTenseToCache(greek, tense, data) {
  try {
    const db = await openDB();
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).put(data, TENSE_CACHE_PREFIX + tense + "_" + greek);
  } catch {}
}

async function fetchVerbTense(greek, transcription, tense) {
  const cached = await getTenseFromCache(greek, tense);
  if (cached) return cached;

  const apiKey = await getApiKey();
  if (!apiKey) return null;

  const tenseInstructions = {
    past: `Conjugate the Greek verb "${greek}" (${transcription}) in the PAST tense (αόριστος), all 6 persons.`,
    future: `Conjugate the Greek verb "${greek}" (${transcription}) in the FUTURE tense, all 6 persons.`,
    imperative: `Give the IMPERATIVE (προστακτική) forms of the Greek verb "${greek}" (${transcription}) — both informal (εσύ) and formal/plural (εσείς), and both imperfective and perfective aspect if they differ.`
  };

  const prompt = `You are a Greek language teacher. ${tenseInstructions[tense]}

Return ONLY a JSON object:
{
  "lines": ["εγώ μίλησα (mílisa)", "εσύ μίλησες (mílises)", "... one line per form"]
}
Keep each line short: person/form + Greek + transliteration in parentheses.`;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: "claude-haiku-4-5",
        max_tokens: 400,
        messages: [{ role: "user", content: prompt }]
      })
    });
    if (!res.ok) throw new Error("API error " + res.status);
    const data = await res.json();
    const text = data.content[0].text.trim();
    const jsonMatch = text.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error("No JSON");
    const result = parseCardJson(jsonMatch[0]);
    if (!result) throw new Error("Could not parse tense JSON");
    await saveTenseToCache(greek, tense, result);
    return result;
  } catch(e) {
    console.error("Tense fetch error:", e);
    return null;
  }
}

// ─── Article lookup (ο/η/το) — cached per word, fetched in batches ──
const ARTICLE_CACHE_PREFIX = "article_v1_";

async function getArticleFromCache(greek) {
  try {
    const db = await openDB();
    const tx = db.transaction(DB_STORE, "readonly");
    const req = tx.objectStore(DB_STORE).get(ARTICLE_CACHE_PREFIX + greek);
    return await new Promise(res => { req.onsuccess = () => res(req.result !== undefined ? req.result : null); req.onerror = () => res(null); });
  } catch { return null; }
}
async function saveArticleToCache(greek, article) {
  try {
    const db = await openDB();
    const tx = db.transaction(DB_STORE, "readwrite");
    // article is "ο"|"η"|"το"|"none" (none = not a noun, skip in exercise)
    tx.objectStore(DB_STORE).put(article, ARTICLE_CACHE_PREFIX + greek);
  } catch {}
}

// Fetches articles for a batch of words in one API call (cheaper than one call per word).
// Returns a map { greekWord: "ο"|"η"|"το"|"none" }. Already-cached words are skipped.
async function fetchArticlesBatch(words) {
  const apiKey = await getApiKey();
  if (!apiKey) return {};

  const uncached = [];
  for (const w of words) {
    const cached = await getArticleFromCache(w[0]);
    if (cached === null) uncached.push(w);
  }
  if (uncached.length === 0) return {};

  const list = uncached.map(w => `"${w[0]}"`).join(", ");
  const prompt = `For each Greek entry below, return its article (ο, η, or το) if it is a noun, otherwise "none".
Rules:
- If the entry already starts with an article (ο/η/το), return that article
- If it is a verb, adjective, adverb, greeting, phrase or expression, return "none"
- Use the EXACT same key string I give you

Entries: ${list}

Return ONLY valid JSON, keys must be exactly as given:
{"entry1": "η", "entry2": "none"}`;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: "claude-haiku-4-5",
        max_tokens: 2000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    if (!res.ok) throw new Error("API error " + res.status);
    const data = await res.json();
    const text = data.content[0].text.trim();
    const jsonMatch = text.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error("No JSON");
    const result = parseCardJson(jsonMatch[0]);
    if (!result) throw new Error("Could not parse articles JSON");
    // Only save words that actually appear in the result — don't save "none" for API failures
    for (const w of uncached) {
      const article = result[w[0]];
      if (article !== undefined) {
        await saveArticleToCache(w[0], article);
      } else {
        // Try with just the base word (without article prefix like "η ", "ο ", "το ")
        const bare = w[0].replace(/^(ο|η|το)\s+/i, "");
        const articleFromBare = result[bare];
        await saveArticleToCache(w[0], articleFromBare || "none");
      }
    }
    return result;
  } catch(e) {
    console.error("Articles batch fetch error:", e);
    // On error, don't save anything — words remain uncached and will retry next scan
    return {};
  }
}

// ─── Mastery system ────────────────────────────────────────────────
// Level 0 = unseen
// Level 1 = flashcard cleared  (Know it clicked, ok>fail)
// Level 2 = quiz Greek→English cleared
// Level 3 = quiz English→Greek cleared
// Level 4 = tile spelling cleared
// Level 5 = full mastered (all 4 modes cleared a 2nd time = streak5 ≥ 1)
// frozen  = level 5 reached 3 times → never decays
// Decay   = level 5 → 4 after 7 days no activity (unless frozen)
// Error   = if mode had been cleared and now accuracy drops below 50% → level recalculated down

function initMastery() {
  const o = {};
  WORDS.forEach(w => {
    o[w[0]] = {
      level:   0,
      streak5: 0,      // times reached level 5
      frozen:  false,
      lastSeen: null,  // timestamp ms
      modes: {
        flash:      { ok:0, fail:0, cleared:false },
        quiz_gr_en: { ok:0, fail:0, cleared:false },
        quiz_en_gr: { ok:0, fail:0, cleared:false },
        tile:       { ok:0, fail:0, cleared:false },
        article:    { ok:0, fail:0, cleared:false },
      },
    };
  });
  return o;
}

// A mode is "cleared" when it has been answered and accuracy > 50%
function checkCleared(m) {
  const tot = m.ok + m.fail;
  return tot > 0 && m.ok / tot > 0.5;
}

function computeLevel(e) {
  if (e.frozen) return 5;
  const ms = e.modes;
  const fl = ms.flash.cleared, q1 = ms.quiz_gr_en.cleared,
        q2 = ms.quiz_en_gr.cleared, ti = ms.tile.cleared;
  if (fl && q1 && q2 && ti) return e.streak5 >= 1 ? 5 : 4;
  if (fl && q1 && q2) return 3;
  if (fl && q1) return 2;
  if (fl) return 1;
  return 0;
}

// Record an answer: mode = "flash"|"quiz_gr_en"|"quiz_en_gr"|"tile"|"article"
function applyAnswer(mastery, wordKey, mode, ok) {
  const prev = mastery[wordKey];
  if (!prev) return mastery;
  // Backfill missing mode (e.g. "article" added after the user already has saved progress)
  const pm = prev.modes[mode] || { ok:0, fail:0, cleared:false };
  const newM = { ...pm, ok: pm.ok + (ok?1:0), fail: pm.fail + (ok?0:1) };
  newM.cleared = checkCleared(newM);
  const newModes = { ...prev.modes, [mode]: newM };
  const newEntry = { ...prev, modes: newModes, lastSeen: Date.now() };
  // compute new level
  const oldLevel = prev.level;
  newEntry.level = computeLevel(newEntry);
  // check if just hit level 5 for first/nth time
  if (newEntry.level === 5 && oldLevel < 5) {
    newEntry.streak5 = (newEntry.streak5 || 0) + 1;
    if (newEntry.streak5 >= 3) newEntry.frozen = true;
  }
  return { ...mastery, [wordKey]: newEntry };
}

// Decay: level 5 → 4 if unseen 7+ days (unless frozen)
function applyDecay(mastery) {
  const now = Date.now();
  const out = {};
  Object.keys(mastery).forEach(k => {
    const e = mastery[k];
    if (!e.frozen && e.level === 5 && e.lastSeen && (now - e.lastSeen) > 7*86400000) {
      // decay: reset all modes' cleared flags so they need re-clearing
      const newModes = {};
      Object.keys(e.modes).forEach(m => { newModes[m] = { ...e.modes[m], cleared:false }; });
      out[k] = { ...e, level:4, modes:newModes };
    } else {
      out[k] = e;
    }
  });
  return out;
}

Verb: conjugate present tense — εγώ / εσύ / αυτός / εμείς / εσείς / αυτοί with transcription on same line.
Noun: article + singular + plural, note gender.
Adjective: masculine / feminine / neuter.
Phrase: write — Fixed expression, no inflection.

## Examples
Exactly 3 sentences:
🇬🇷 [Greek]
📢 [transcription]
🇬🇧 [English]

## Notes
1-2 sentences on register, context, or common mistake.`;

    // Check online status before calling API

  return (

// ─── Custom words storage ───────────────────────────────────────────
const CUSTOM_WORDS_KEY = "custom_words";

async function loadCustomWords() {
  try {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(DB_STORE, "readonly");
      const req = tx.objectStore(DB_STORE).get(CUSTOM_WORDS_KEY);
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => resolve([]);
    });
  } catch { return []; }
}

async function saveCustomWords(words) {
  try {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(DB_STORE, "readwrite");
      tx.objectStore(DB_STORE).put(words, CUSTOM_WORDS_KEY);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  } catch { return false; }
}

async function enrichWord(greek, english) {
  const apiKey = await getApiKey();
  if (!apiKey) return { tr: greek, topic: "Subjects" };
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: "claude-haiku-4-5",
        max_tokens: 100,
        messages: [{ role: "user", content: `For the Greek word/phrase "${greek}" meaning "${english}":
1. Provide the Latin transliteration
2. Choose the best topic from: Greetings, Numbers, Family, Food, City, Time, Health, Adjectives, Verbs, Subjects, Alphabet, Animals, Nature, Home, Clothes, Work, Emotions, Education, Technology, Sports, Transport, Shopping, Media, Society, Culture
Return ONLY JSON: {"tr": "...", "topic": "..."}` }]
      })
    });
    if (res.ok) {
      const data = await res.json();
      const match = data.content[0].text.match(/\{[\s\S]*\}/);
      if (match) return JSON.parse(match[0]);
    }
  } catch(e) {}
  return { tr: greek, topic: "Subjects" };
}

async function addWordToList(greek, english, tr, topic, onAdded, subtopic) {
  // Normalize: trim whitespace
  greek = greek.trim();
  // Duplicate detection against both WORDS and custom words
  if (WORDS.find(w => w[0] === greek)) return "duplicate";
  const existing = await loadCustomWords();
  if (existing.find(w => w[0] === greek)) return "duplicate";
  const newWord = subtopic ? [greek, tr, english, topic, subtopic] : [greek, tr, english, topic];
  const updated = [...existing, newWord];
  await saveCustomWords(updated);
  WORDS.push(newWord);
  if (onAdded) onAdded(newWord);
  return "added";
}

            { type:"text", text:`Extract all Greek words or phrases visible in this image.

Normalization rules:
- NOUNS: always prefix with definite article (ο/η/το), e.g. "ο πατέρας", "η μητέρα", "το νερό"
- VERBS: use 1st person singular present tense (infinitive/dictionary form), e.g. "μιλάω", "τρώω"
- ADJECTIVES/EXPRESSIONS: no article

For each word provide:
- gr: normalized Greek (with article for nouns, 1st person for verbs)
- tr: Latin transliteration
- en: English translation (1-5 words, no article)
- topic: best topic from: Greetings, Numbers, Family, Food, City, Time, Health, Adjectives, Verbs, Subjects, Alphabet, Animals, Nature, Home, Clothes, Work, Emotions, Education, Technology, Sports, Transport, Shopping, Media, Society, Culture
- subtopic: specific subcategory (2-4 words, e.g. "Immediate Family", "Drinks", "Movement Verbs", "Body Parts")

Return ONLY a JSON array: [{"gr":"...","tr":"...","en":"...","topic":"...","subtopic":"..."}]` }
          ]}]
        })
      });
      if (res.ok) {
        const data = await res.json();
        const match = data.content[0].text.match(/\[[\s\S]*\]/);
        if (match) setPhotoResults(JSON.parse(match[0]));
        else setError("Could not extract words from image.");

function DictTab({ mastery, tsel, setTsel }) {
  const [q, setQ]           = useState("");
  const [selected, setSel]  = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [, forceUpdate]     = useState(0);

  // Load custom words on mount
  React.useEffect(() => {
    loadCustomWords().then(cw => {
      cw.forEach(w => { if (!WORDS.find(x=>x[0]===w[0])) WORDS.push(w); });
      forceUpdate(n=>n+1);
    });
  }, []);
  function wStats(w) {
    const e = mastery[w[0]];
    if (!e) return { ok:0, fail:0, level:0 };
    const ok   = Object.values(e.modes).reduce((a,m)=>a+m.ok,0);
    const fail = Object.values(e.modes).reduce((a,m)=>a+m.fail,0);
    return { ok, fail, level:e.level, frozen:e.frozen };
  }

  const rows = useMemo(() =>
    selWords(tsel).filter(w => !q||(w[0]+w[1]+w[2]).toLowerCase().includes(q.toLowerCase())),
    [q, tsel]
  );

  // Per-topic stats for the progress bar
  const topicStats = useMemo(() => {
    const wordsInTopic = selWords(tsel);
    const total = wordsInTopic.length;
    const mastered = wordsInTopic.filter(w=>{
      const e = mastery[w[0]]; return e && (e.level>=5||e.frozen);
    }).length;
    const learning = wordsInTopic.filter(w=>{
      const e = mastery[w[0]]; return e && e.level>0 && e.level<5 && !e.frozen;
    }).length;
    const pct = total ? Math.round(mastered/total*100) : 0;
    return { total, mastered, learning, pct };
  }, [tsel, mastery]);

  return (
    <div style={{ position:"relative" }}>
      <CardDetail word={selected} onClose={()=>setSel(null)} />
      {showAdd && <AddWordModal onClose={()=>setShowAdd(false)} onAdded={()=>forceUpdate(n=>n+1)} />}
      <div style={{ display:"flex", gap:8, marginBottom:".8rem" }}>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search…" style={{ flex:1, padding:"7px 11px", border:"0.5px solid #ccc", borderRadius:8, fontSize:13, background:"transparent", fontFamily:"inherit" }} />
        <button onClick={()=>setShowAdd(true)} style={{ padding:"7px 14px", borderRadius:8, border:"none", background:"#534AB7", color:"white", fontSize:13, cursor:"pointer", fontWeight:600, whiteSpace:"nowrap" }}>+ Add</button>
      </div>

      <TopicPicker sel={tsel} setSel={setTsel} />

      {/* Topic progress bar */}
      <div style={{ background:"#f8f8f8", borderRadius:10, padding:"10px 14px", marginBottom:"1rem", border:"0.5px solid #eee" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:6 }}>
          <span style={{ fontSize:12, fontWeight:500, color:"#333" }}>
            {selLabel(tsel)}
          </span>
          <div style={{ display:"flex", gap:12, fontSize:11, color:"#888" }}>
            <span>📚 {topicStats.total} words</span>
            <span style={{ color:"#BA7517" }}>◑ {topicStats.learning} learning</span>
            <span style={{ color:"#1D9E75" }}>★ {topicStats.mastered} mastered</span>
          </div>
        </div>
        <div style={{ height:8, background:"#e5e5e5", borderRadius:4, overflow:"hidden" }}>
          <div style={{
            height:8,
            width:`${topicStats.pct}%`,
            background: topicStats.pct>=80?"#1D9E75":topicStats.pct>=40?"#BA7517":"#7F77DD",
            borderRadius:4, transition:"width .4s",
          }}/>
        </div>
        <div style={{ fontSize:10, color:"#aaa", marginTop:4, textAlign:"right" }}>{topicStats.pct}% mastered</div>
      </div>

      <div style={{ fontSize:11, color:"#bbb", marginBottom:".6rem" }}>Tap any row for a detailed AI reference card</div>
      <div style={{ overflowX:"auto" }}>
        <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
          <thead>
            <tr>
              {["Greek","Transcription","English","Progress"].map((h,i) => (
                <th key={h} style={{ padding:"6px 8px", fontSize:11, fontWeight:500, color:"#888", borderBottom:"0.5px solid #e5e5e5", textAlign:"left", textTransform:"uppercase", letterSpacing:".04em", width:i===3?90:"auto" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.length ? rows.map((w,i) => {
              const s   = wStats(w);
              const tot = s.ok + s.fail;
              const pct = tot ? Math.round(s.ok/tot*100) : 0;
              const lvl = s.level||0;
              const col = lv(lvl).color;
              const ok  = lvl >= 5 || s.frozen;
              return (
                <tr key={i} onClick={()=>setSel(w)} style={{ cursor:"pointer" }}
                  onMouseEnter={e=>e.currentTarget.style.background="#f5f4ff"}
                  onMouseLeave={e=>e.currentTarget.style.background=""}>
                  <td style={{ padding:"8px", borderBottom:"0.5px solid #f0f0f0", fontSize:14 }}>
                    {ok && <span style={{ color:"#1D9E75", marginRight:4, fontSize:11 }}>✓</span>}
                    
                    {w[0]}
                  </td>
                  <td style={{ padding:"8px", borderBottom:"0.5px solid #f0f0f0", color:"#888", fontStyle:"italic", fontSize:12 }}>{w[1]}</td>
                  <td style={{ padding:"8px", borderBottom:"0.5px solid #f0f0f0" }}>{w[2]}</td>
                  <td style={{ padding:"8px", borderBottom:"0.5px solid #f0f0f0" }}>
                    {tot > 0 ? (
                      <div>
                        <Bar pct={pct} color={col} />
                        <div style={{ fontSize:10, color:"#aaa", textAlign:"right", marginTop:2 }}>{s.ok}/{tot} · {pct}% · lv{lvl}</div>
                      </div>
                    ) : <span style={{ fontSize:10, color:"#ccc" }}>—</span>}
                  </td>
                </tr>
              );
            }) : <tr><td colSpan={4} style={{ padding:"2rem", textAlign:"center", color:"#888" }}>Not found</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ─── Render text with clickable Greek words ─────────────────────────
function GreekText({ text, onWordClick, style }) {
  if (!text) return null;
  // Match Greek unicode characters (including extended Greek)
  const parts = text.split(/([\u0370-\u03FF\u1F00-\u1FFF][\u0370-\u03FF\u1F00-\u1FFF\s]*[\u0370-\u03FF\u1F00-\u1FFF]+|[\u0370-\u03FF\u1F00-\u1FFF]+)/g);
  return (
    <span style={style}>
      {parts.map((part, i) => {
        const isGreek = /[\u0370-\u03FF\u1F00-\u1FFF]/.test(part);
        if (isGreek && part.trim()) {
          return (
            <span key={i} onClick={e=>{e.stopPropagation(); onWordClick(part.trim());}}
              style={{ color:"#534AB7", fontWeight:600, cursor:"pointer", borderBottom:"1px dotted #534AB7", textDecoration:"none" }}>
              {part}
            </span>
          );
        }
        return <span key={i}>{part}</span>;
      })}
    </span>
  );
}

function CardDetail({ word, onClose }) {
  if (!word) return null;
  const [card, setCard] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState(null);
  const [noKey, setNoKey] = React.useState(false);
  const [showKeyModal, setShowKeyModal] = React.useState(false);
  // Navigation history for hyperlink-style browsing
  const [history, setHistory] = React.useState([word]);
  const [histIdx, setHistIdx] = React.useState(0);
  const curWord = history[histIdx];
  // Collapsible sections — Forms/Word family/Examples open by default, rest collapsed
  const [openSections, setOpenSections] = React.useState({ forms:true, family:true, synonyms:false, examples:true, notes:false });
  // Extra verb tenses, loaded on demand: { past: {lines:[...]}, future:..., imperative:... }
  const [extraTenses, setExtraTenses] = React.useState({});
  const [tenseLoading, setTenseLoading] = React.useState(null);

  function toggleSection(key) {
    setOpenSections(s => ({ ...s, [key]: !s[key] }));
  }

  function loadExtraTense(tense) {
    if (extraTenses[tense] || tenseLoading) return;
    setTenseLoading(tense);
    fetchVerbTense(curWord[0], curWord[1], tense)
      .then(result => { if (result) setExtraTenses(s => ({ ...s, [tense]: result })); })
      .finally(() => setTenseLoading(null));
  }

  function loadCard(w) {
    setCard(null); setLoading(true); setError(null); setNoKey(false);
    setExtraTenses({});
    fetchWordCard(w[0], w[1], w[2], w[3])
      .then(result => {
        if (result) setCard(result);
        else {
          getApiKey().then(k => {
            if (!k) setNoKey(true);
            else setError("Could not load. Check connection.");
          });
        }
      })
      .catch(() => setError("Could not load."))
      .finally(() => setLoading(false));
  }

  React.useEffect(() => { loadCard(curWord); }, [curWord[0]]);

  function navigateTo(greekWord) {
    // Find word in WORDS array, or create a stub for AI-only lookup
    const found = WORDS.find(w => w[0] === greekWord);
    const target = found || [greekWord, "", "", ""];
    const newHistory = [...history.slice(0, histIdx+1), target];
    setHistory(newHistory);
    setHistIdx(newHistory.length - 1);
  }

  function goBack() {
    if (histIdx > 0) setHistIdx(histIdx - 1);
  }

  return (
    <>
    {showKeyModal && <ApiKeyModal onClose={()=>setShowKeyModal(false)} onSaved={loadCard} />}
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.45)", zIndex:1000, display:"flex", alignItems:"flex-end", justifyContent:"center" }}>
      <div onClick={e=>e.stopPropagation()} style={{ background:"white", borderRadius:"16px 16px 0 0", width:"100%", maxWidth:540, maxHeight:"75vh", overflowY:"auto", boxShadow:"0 -4px 30px rgba(0,0,0,0.2)" }}>
        {/* header */}
        <div style={{ background:"#EEEDFE", borderRadius:"16px 16px 0 0", padding:"14px 18px", display:"flex", justifyContent:"space-between", alignItems:"flex-start", position:"sticky", top:0 }}>
          <div style={{ flex:1, minWidth:0 }}>
            {histIdx > 0 && (
              <button onClick={goBack} style={{ background:"none", border:"none", color:"#7F77DD", fontSize:13, cursor:"pointer", padding:"0 0 4px 0", fontFamily:"inherit" }}>← Back</button>
            )}
            <div style={{ fontSize:22, fontWeight:700, color:"#26215C" }}>{curWord[0]}</div>
            <div style={{ fontSize:13, color:"#7F77DD", fontStyle:"italic" }}>{curWord[1] || (card && card.headTr) || ""}</div>
            <div style={{ fontSize:13, color:"#534AB7" }}>{curWord[2] || (card && card.headEn) || ""}</div>
          </div>
          <div style={{ display:"flex", gap:6, flexShrink:0 }}>
            <button onClick={()=>setShowKeyModal(true)} style={{ background:"white", border:"0.5px solid #AFA9EC", borderRadius:8, padding:"4px 10px", fontSize:14, cursor:"pointer", color:"#534AB7", fontFamily:"inherit" }} title="Set API Key">🔑</button>
            <button onClick={async () => {
              setCard(null); setLoading(true); setError(null); setNoKey(false);
              try {
                const db = await openDB();
                const tx = db.transaction(DB_STORE, "readwrite");
                tx.objectStore(DB_STORE).delete(CARD_CACHE_PREFIX + curWord[0]);
              } catch {}
              loadCard(curWord);
            }} style={{ background:"white", border:"0.5px solid #AFA9EC", borderRadius:8, padding:"4px 10px", fontSize:14, cursor:"pointer", color:"#534AB7", fontFamily:"inherit" }} title="Refresh">🔄</button>
            <button onClick={onClose} style={{ background:"white", border:"0.5px solid #AFA9EC", borderRadius:8, padding:"4px 10px", fontSize:16, cursor:"pointer", color:"#534AB7", fontFamily:"inherit" }}>✕</button>
          </div>
        </div>
        <div style={{ padding:"16px 18px" }}>
          {loading && (
            <div style={{ textAlign:"center", padding:"2rem", color:"#888" }}>
              <div style={{ fontSize:28, marginBottom:8 }}>⏳</div>

// ─── Per-word stats badge — shown faintly on exercise cards ─────────
// Breaks down attempts/accuracy per exercise mode for a single word.
// Returns null if the word has never been attempted in any mode.
const MODE_LABELS = { flash:"Flash", quiz_gr_en:"Quiz", quiz_en_gr:"Quiz", tile:"Type", article:"Article" };

function wordStats(mastery, greekWord) {
  const e = mastery && mastery[greekWord];
  if (!e) return null;
  // Merge quiz_gr_en + quiz_en_gr into a single "Quiz" bucket
  const buckets = { Flash:{ok:0,fail:0}, Quiz:{ok:0,fail:0}, Type:{ok:0,fail:0}, Article:{ok:0,fail:0} };
  Object.entries(e.modes).forEach(([mode, m]) => {
    const label = MODE_LABELS[mode];
    if (!label) return;
    buckets[label].ok += m.ok;
    buckets[label].fail += m.fail;
  });
  const perMode = Object.entries(buckets)
    .map(([label, m]) => {
      const attempts = m.ok + m.fail;
      if (attempts === 0) return null;
      return { label, attempts, pct: Math.round((m.ok/attempts)*100), ok:m.ok, fail:m.fail };
    })
    .filter(Boolean);
  if (perMode.length === 0) return null;
  const totalOk = perMode.reduce((a,m)=>a+m.ok,0), totalAtt = perMode.reduce((a,m)=>a+m.attempts,0);
  return { perMode, totalAttempts: totalAtt, totalPct: Math.round((totalOk/totalAtt)*100) };
}

function WordStatsBadge({ mastery, greekWord, style, compact }) {
  const stats = wordStats(mastery, greekWord);
  if (!stats) return null;
  const colorFor = pct => pct >= 80 ? "#1D9E75" : pct >= 50 ? "#BA7517" : "#E24B4A";
  if (compact) {
    return (
      <div style={{ fontSize:10, color:"#bbb", display:"flex", flexDirection:"column", alignItems:"flex-end", gap:1, lineHeight:1.4, ...style }}
        title={`${stats.totalAttempts} attempts total, ${stats.totalPct}% correct`}>
        {stats.perMode.map(m => (
          <span key={m.label}>{m.label} <span style={{ color:colorFor(m.pct), fontWeight:600 }}>{m.pct}%</span></span>
        ))}
      </div>
    );
  }
  return (
    <div style={{ fontSize:11, color:"#aaa", display:"flex", alignItems:"center", gap:6, flexWrap:"wrap", justifyContent:"center", ...style }}
      title={`${stats.totalAttempts} attempts total, ${stats.totalPct}% correct`}>
      {stats.perMode.map((m,i) => (
        <React.Fragment key={m.label}>
          {i>0 && <span style={{ color:"#ddd" }}>·</span>}
          <span>{m.label} <span style={{ color:colorFor(m.pct), fontWeight:500 }}>{m.pct}%</span></span>
        </React.Fragment>
      ))}
    </div>
  );
}

function FlashTab({ mastery, rec, tsel, setTsel }) {
  const [face, setFace]         = useState(0);
  const [hardOnly, setHardOnly] = useState(false);
  const [deck, setDeck]         = useState(() => shuf(selWords(tsel)));
  const [idx, setIdx]           = useState(0);
  const [flipped, setFlipped]   = useState(false);
  const [speaking, setSpeaking] = useState(false);
  const [autoSpeak, setAutoSpeak] = useState(true);
  const [showDetail, setShowDetail] = useState(false);

  // Speak Greek text using Web Speech API
  function speak(text, times = 1) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    setSpeaking(true);
    let count = 0;
    function sayOnce() {
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = "el-GR";
      utt.rate = 0.85;
      utt.pitch = 1;
      utt.onend = () => {
        count++;
        if (count < times) {
          setTimeout(sayOnce, 1200);
        } else {
          setSpeaking(false);
        }
      };
      utt.onerror = () => setSpeaking(false);
      window.speechSynthesis.speak(utt);
    }
    sayOnce();
  }

  // rebuild the deck whenever the topic selection changes
  const firstSel = React.useRef(true);
  React.useEffect(() => { if (firstSel.current) { firstSel.current = false; return; } build(face, hardOnly); }, [tsel]);

  function build(f, hard) {
    let p = selWords(tsel);
    if (hard) { const h=p.filter(w=>{ const e=mastery[w[0]]; if(!e) return false; const mf=Object.values(e.modes).reduce((a,m)=>a+m.fail,0); const mo=Object.values(e.modes).reduce((a,m)=>a+m.ok,0); return mf>mo; }); if(h.length)p=h; }
    setDeck(shuf(p)); setIdx(0); setFlipped(false);
    window.speechSynthesis && window.speechSynthesis.cancel();
  }

  const w = deck[idx] || WORDS[0];
  const views = [
    { front:w[0], fsub:w[1], back:w[2], bsub:w[1], fl:"Greek", bl:"English", greekOnBack: false },
    { front:w[2], fsub:"",   back:w[0], bsub:w[1], fl:"English", bl:"Greek", greekOnBack: true },
    { front:w[1], fsub:"",   back:w[0], bsub:w[2], fl:"Transcription", bl:"Greek", greekOnBack: true },
  ];
  const v = views[face];

  function flipCard() {
    const newFlipped = !flipped;
    setFlipped(newFlipped);
    // When flipping to back — speak the Greek word 2 times if autoSpeak is on
    if (newFlipped && autoSpeak) {
      // Always speak the Greek word (w[0])
      setTimeout(() => speak(w[0], 2), 300); // wait for flip animation
    }
  }

  function rate(ok) {
    window.speechSynthesis && window.speechSynthesis.cancel();
    rec(w[0], 'flash', ok);
    if (ok) { setIdx((idx+1)%deck.length); }
    else { const nd=[...deck]; nd.splice(idx,1); nd.splice(Math.min(idx+2,nd.length),0,w); setDeck(nd); setIdx(idx>=nd.length?0:idx); }
    setFlipped(false);
  }

  return (
    <div>
      <TopicPicker sel={tsel} setSel={setTsel} collapsible defaultOpen={false} />
      <div style={{ display:"flex", gap:6, flexWrap:"wrap", alignItems:"center", marginBottom:".8rem" }}>
        <span style={{ fontSize:12, color:"#888", fontWeight:500 }}>Front:</span>
        {["Greek","English","Transcription"].map((l,i)=><Chip key={l} label={l} on={face===i} onClick={()=>{setFace(i);build(i,hardOnly);}}/>)}
        <span style={{ fontSize:12, color:"#888", fontWeight:500, marginLeft:6 }}>Mode:</span>
        <Chip label="All" on={!hardOnly} onClick={()=>{setHardOnly(false);build(face,false);}}/>
        <Chip label="Hard only" on={hardOnly} onClick={()=>{setHardOnly(true);build(face,true);}}/>
      </div>

      {/* top row: restart / counter / audio toggle */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:".6rem" }}>
        <button onClick={()=>build(face,hardOnly)} style={{ fontSize:13, color:"#888", background:"none", border:"none", cursor:"pointer", fontFamily:"inherit", padding:0 }}>↺ Restart</button>
        <span style={{ fontSize:13, color:"#888" }}>{idx+1} / {deck.length}</span>
        <button onClick={()=>setAutoSpeak(a=>!a)} style={{
          fontSize:12, padding:"3px 10px", borderRadius:20, cursor:"pointer", fontFamily:"inherit",
          border: autoSpeak?"0.5px solid #7F77DD":"0.5px solid #ccc",
          background: autoSpeak?"#EEEDFE":"transparent",
          color: autoSpeak?"#3C3489":"#888",
        }}>
          {speaking ? "🔊 …" : autoSpeak ? "🔊 Auto" : "🔇 Mute"}
        </button>
      </div>

      {/* card */}
      <div onClick={flipCard} style={{ perspective:800, width:"100%", maxWidth:420, height:170, margin:"0 auto 1.2rem", cursor:"pointer" }}>
        <div style={{ width:"100%", height:"100%", position:"relative", transformStyle:"preserve-3d", transition:"transform .4s", transform:flipped?"rotateY(180deg)":"none" }}>
          {[false,true].map(back => (
            <div key={String(back)} style={{ position:"absolute", width:"100%", height:"100%", backfaceVisibility:"hidden", transform:back?"rotateY(180deg)":"none", border:"0.5px solid #e0e0e0", borderRadius:12, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"1.4rem", background:back?"#f8f8f8":"white" }}>
              <WordStatsBadge mastery={mastery} greekWord={w[0]} compact style={{ position:"absolute", top:10, right:12 }} />
              <div style={{ fontSize:11, color:"#aaa", textTransform:"uppercase", letterSpacing:".06em", marginBottom:7 }}>{back?v.bl:v.fl}</div>
              <div style={{ fontSize:22, fontWeight:500, textAlign:"center", lineHeight:1.3 }}>{back?v.back:v.front}</div>
              <div style={{ fontSize:12, color:"#aaa", marginTop:6, fontStyle:"italic" }}>{back?v.bsub:v.fsub}</div>
              {!back && <div style={{ fontSize:11, color:"#ccc", marginTop:8 }}>Tap to flip</div>}
              {back && (
                <button
                  onClick={e=>{ e.stopPropagation(); setShowDetail(true); }}
                  style={{ marginTop:10, padding:"5px 14px", borderRadius:20, border:"0.5px solid #7F77DD", background:"#EEEDFE", color:"#3C3489", fontSize:12, cursor:"pointer", fontFamily:"inherit" }}>
                  📖 More
                </button>
              )}
            </div>
          ))}
        </div>
      </div>

      {/* card detail bottom sheet */}
      {showDetail && <CardDetail word={w} onClose={()=>setShowDetail(false)}/>}

      {/* speak button + nav */}
      <div style={{ display:"flex", gap:8, justifyContent:"center", alignItems:"center", marginBottom:"1rem", flexWrap:"wrap" }}>
        <button onClick={()=>rate(0)} style={{ padding:"8px 16px", border:"0.5px solid #E24B4A", borderRadius:8, background:"#FCEBEB", color:"#501313", fontSize:13, cursor:"pointer", fontFamily:"inherit" }}>✕ Don't know</button>
        <button onClick={()=>speak(w[0], 2)} disabled={speaking} style={{
          padding:"8px 14px", borderRadius:8, border:"0.5px solid #7F77DD",
          background: speaking?"#EEEDFE":"white", color:"#534AB7",
          fontSize:16, cursor:speaking?"default":"pointer", fontFamily:"inherit",
        }} title="Pronounce">
          {speaking ? "🔊" : "🔈"}
        </button>
        <button onClick={()=>rate(1)} style={{ padding:"8px 16px", border:"0.5px solid #1D9E75", borderRadius:8, background:"#E1F5EE", color:"#085041", fontSize:13, cursor:"pointer", fontFamily:"inherit" }}>✓ Know it</button>
      </div>
      <div style={{ textAlign:"center" }}><Btn onClick={()=>build(face,hardOnly)}>↺ Shuffle</Btn></div>
    </div>
  );
}

// ─── Quiz ──────────────────────────────────────────────────────────
function QuizTab({ mastery, rec, tsel, setTsel }) {
  const [mi, setMi]       = useState(0);
  const [cnt, setCnt]     = useState("20");
  const [phase, setPhase] = useState("setup");
  const [qs, setQs]       = useState([]);
  const [qi, setQi]       = useState(0);
  const [score, setScore] = useState(0);
  const [locked, setLocked] = useState(false);
  const [chosen, setChosen] = useState(null);
  const [opts, setOpts]   = useState([]);
  const [showHint, setShowHint] = useState(false);
  const [showDetail, setShowDetail] = useState(false);

  // TTS helper — speak Greek word once
  function speakGreek(text) {
    if (!window.speechSynthesis || !text) return;
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = "el-GR";
    utt.rate = 0.85;
    window.speechSynthesis.speak(utt);
  }

  function makeOpts(pool, i, m) {
    const w=pool[i], c=QM[m].a(w);
    const modeIdx = QM.indexOf(m) !== -1 ? QM.indexOf(m) : m;

    // Smart distractors: prefer same topic, then same "shape"
    // For Greek→English or EN→Greek: pick words from same topic first
    const sameTopic  = WORDS.filter(x => x[3]===w[3] && QM[m].a(x)!==c);
    const otherWords = WORDS.filter(x => x[3]!==w[3] && QM[m].a(x)!==c);

    // Also filter by similar word type using CARDS part-of-speech
    // e.g. if correct is a verb, prefer verb distractors
    const correctCard = CARDS[w[0]];
    const correctPos  = correctCard ? correctCard.p.toLowerCase() : "";
    const isVerb      = correctPos.includes("verb");
    const isNoun      = correctPos.includes("noun");
    const isAdj       = correctPos.includes("adj");

    const samePos = (candidate) => {
      const card = CARDS[candidate[0]];
      if (!card) return false;
      const p = card.p.toLowerCase();
      if (isVerb) return p.includes("verb");
      if (isNoun) return p.includes("noun");
      if (isAdj)  return p.includes("adj");
      return true;
    };

    // Priority: same topic + same pos → same topic → same pos → anything
    const tier1 = shuf(sameTopic.filter(samePos));
    const tier2 = shuf(sameTopic.filter(x=>!samePos(x)));
    const tier3 = shuf(otherWords.filter(samePos));
    const tier4 = shuf(otherWords);

    const candidates = [...tier1, ...tier2, ...tier3, ...tier4];
    // Deduplicate by answer value
    const seen = new Set([c]);
    const dis = [];
    for (const x of candidates) {
      const a = QM[m].a(x);
      if (!seen.has(a)) { seen.add(a); dis.push(a); }
      if (dis.length === 3) break;
    }
    // Pad if not enough
    while (dis.length < 3) {
      const fallback = WORDS.find(x => !seen.has(QM[m].a(x)));
      if (!fallback) break;
      seen.add(QM[m].a(fallback));
      dis.push(QM[m].a(fallback));
    }
    setOpts(shuf([c, ...dis]));
  }
  function start() {
    const pool0 = selWords(tsel);
    const n = cnt==="all"?pool0.length:+cnt;
    const pool = shuf(pool0).slice(0,Math.min(n,pool0.length));
    setQs(pool); setQi(0); setScore(0); setLocked(false); setChosen(null); setShowHint(false);
    makeOpts(pool,0,mi); setPhase("game");
  }
  function pick(o) {
    if (locked) return;
    const correct=QM[mi].a(qs[qi]), ok=o===correct;
    setLocked(true); setChosen(o);
    if(ok) setScore(s=>s+1);
    const modeKey = mi===0?"quiz_gr_en":mi===1?"quiz_en_gr":mi===2?"quiz_gr_en":"quiz_gr_en";
    rec(qs[qi][0], modeKey, ok);
    // Speak Greek word when answer is shown (feedback moment)
    speakGreek(qs[qi][0]);
    setTimeout(()=>{
      const next=qi+1;
      if(next>=qs.length){setPhase("result");return;}
      setQi(next); setLocked(false); setChosen(null); setShowHint(false);
      makeOpts(qs,next,mi);
    }, ok?500:1000);
  }

  if (phase==="setup") return (

      </div>
      {/* Topic stats block */}
      {(()=>{
        const words = selWords(tsel);
        const total = words.length;
        const learning = words.filter(w=>{ const m=mastery[w[0]]; return m&&m.level>0&&m.level<5&&!m.frozen; }).length;
        const mastered = words.filter(w=>{ const m=mastery[w[0]]; return m&&(m.level>=5||m.frozen); }).length;
        const unseen = total - words.filter(w=>mastery[w[0]]&&(mastery[w[0]].level>0||mastery[w[0]].frozen)).length;
        const label = selLabel(tsel);
        return (
          <div style={{ background:"#f7f7ff", border:"0.5px solid #AFA9EC", borderRadius:10, padding:"10px 16px", marginBottom:"1rem", fontSize:13 }}>

            <div style={{ display:"flex", gap:16, flexWrap:"wrap" }}>
              <span>📚 <strong>{total}</strong> words</span>
              <span style={{color:"#888"}}>👁 <strong>{unseen}</strong> unseen</span>
              <span style={{color:"#BA7517"}}>◑ <strong>{learning}</strong> learning</span>
              <span style={{color:"#1D9E75"}}>★ <strong>{mastered}</strong> mastered</span>
              {total > 0 && <span style={{color:"#534AB7"}}>📈 <strong>{Math.round(mastered/total*100)}%</strong></span>}
            </div>
          </div>
        );
      })()}

      <div style={{ display:"flex", alignItems:"center", gap:8, justifyContent:"center", marginBottom:"1rem" }}>
        <span style={{ fontSize:13, color:"#888" }}>Questions:</span>
        <select value={cnt} onChange={e=>setCnt(e.target.value)} style={{ padding:"4px 8px", border:"0.5px solid #ccc", borderRadius:8, background:"transparent", fontSize:13, fontFamily:"inherit" }}>
          {(()=>{
            const total = selWords(tsel).length;
            const opts = ["10","20","30","50","75","100","150","all"];
            return opts.filter(v => v==="all" || Number(v) <= total)
              .map(v=><option key={v} value={v}>{v==="all" ? `all (${total})` : v}</option>);
          })()}
        </select>
      </div>
      <div style={{ textAlign:"center" }}><Btn onClick={start}>Start →</Btn></div>
    </div>
  );
  // Determine flip mode: swap direction of current mode
  const flipMi = mi===0?1 : mi===1?0 : mi===2?3 : mi===3?2 : 0;
  const flipLabel = QM[flipMi].label;

  function doRetry(newMi) {
    const reshuffled = shuf([...qs]);
    setMi(newMi);
    setQs(reshuffled); setQi(0); setScore(0); setLocked(false); setChosen(null); setShowHint(false);
    makeOpts(reshuffled, 0, newMi);
    setPhase("game");
  }

  if (phase==="result") return <ResBox
    score={score} total={qs.length}
    onRetry={()=>doRetry(mi)}
    onFlip={()=>doRetry(flipMi)}
    flipLabel={flipLabel}
  />;

  const w=qs[qi], m=QM[mi], correct=m.a(w);
  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"1rem" }}>
        <button onClick={()=>setPhase("setup")} style={{ fontSize:13, color:"#888", background:"none", border:"none", cursor:"pointer", fontFamily:"inherit", padding:0 }}>← Back</button>
        <span style={{ fontSize:13, color:"#888" }}>{qi+1}/{qs.length}</span>
        <Pill>{score} correct</Pill>
      </div>
      <Bar pct={Math.round((qi+1)/qs.length*100)} h={4}/>
      <div style={{ marginBottom:"1.4rem" }}/>
      <div style={{ textAlign:"center" }}>
        <div style={{ position:"relative", border:"0.5px solid #e0e0e0", borderRadius:12, padding:"1.2rem 1rem 1rem", marginBottom:"1.2rem", background:"white" }}>
          <WordStatsBadge mastery={mastery} greekWord={w[0]} compact style={{ position:"absolute", top:10, right:12 }} />
          <button
            onClick={e=>{ e.stopPropagation(); setShowDetail(true); }}
            style={{ position:"absolute", top:10, left:12, padding:"3px 9px", borderRadius:14, border:"0.5px solid #7F77DD", background:"#EEEDFE", color:"#3C3489", fontSize:11, cursor:"pointer", fontFamily:"inherit" }}>
            📖 More
          </button>
          <div
            onClick={() => { if (mi === 0 || mi === 2 || mi === 3) { const next = !showHint; setShowHint(next); if(next) speakGreek(w[0]); } }}
            style={{ fontSize:28, fontWeight:600, marginBottom:6, cursor: (mi===0||mi===2||mi===3) ? "pointer" : "default", display:"inline-block", padding:"6px 12px", borderRadius:8, transition:"background .15s" }}
            title={mi===0||mi===2||mi===3 ? "Tap to see transcription" : ""}
          >{m.q(w)}</div>
          <div style={{ height:22, marginBottom:6, display:"flex", alignItems:"center", justifyContent:"center" }}>
            {showHint && (mi===0||mi===2||mi===3)
              ? <span style={{ fontSize:13, color:"#7F77DD", fontStyle:"italic", animation:"fadeIn .2s" }}>{w[1]}</span>
              : (mi===0||mi===2||mi===3)
                ? <span style={{ fontSize:11, color:"#ccc" }}>tap word for transcription</span>
                : null
            }
          </div>
          <div style={{ fontSize:15, color:"#888" }}>{m.h}</div>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
          {opts.map(o => {
            const isC=o===correct, isP=o===chosen;
            let bg="transparent", border="0.5px solid #ccc", color="#333";
            if(locked){if(isC){bg="#E1F5EE";border="0.5px solid #1D9E75";color="#085041";}else if(isP){bg="#FCEBEB";border="0.5px solid #E24B4A";color="#501313";}}
            return (

// ─── helpers for tile puzzle ───────────────────────────────────────
function makeTiles(answer) {
  // Split answer into chars (letters only, spaces kept as space tiles)
  const chars = answer.split("").filter(c => c !== " ");
  // Add ~40% extra random letters from the same alphabet (greek or latin)
  const greekPool = "αβγδεζηθικλμνξοπρστυφχψω";
  const latinPool  = "abcdefghijklmnoprstuvwxyz";
  const isGreek    = /[\u0370-\u03ff]/.test(answer);
  const pool       = isGreek ? greekPool : latinPool;
  const extraCount = Math.max(2, Math.floor(chars.length * 0.5));
  const extras     = Array.from({length: extraCount}, () => pool[Math.floor(Math.random()*pool.length)]);
  return shuf([...chars, ...extras].map((ch, i) => ({ id:i, ch, used:false })));
}

// ─── Type (Tobo-style tile puzzle) ────────────────────────────────
function TypeTab({ mastery, rec, tsel, setTsel }) {
  const [cnt, setCnt]     = useState("20");
  const [mode, setMode]   = useState("gr"); // "gr"=show EN→type Greek, "tr"=show EN→type Transcription
  const [phase, setPhase] = useState("setup");
  const [qs, setQs]       = useState([]);
  const [qi, setQi]       = useState(0);
  const [score, setScore] = useState(0);

  // tile state
  const [tiles, setTiles]     = useState([]); // {id, ch, used}
  const [picked, setPicked]   = useState([]); // [{id, ch}] — slots filled so far
  const [res, setRes]         = useState(null); // null|"ok"|"bad"
  const [hintCount, setHintCount] = useState(0); // letters revealed by hint
  const [showDetail, setShowDetail] = useState(false);

  function getAnswer(w) { return mode==="gr" ? w[0].replace(/\s/g,"") : w[1].replace(/\s/g,""); }
  function getQuestion(w) { return w[2]; } // always show English

  function initRound(pool, i) {
    const w = pool[i];
    const answer = getAnswer(w);
    setTiles(makeTiles(answer));
    setPicked([]);
    setRes(null);
    setHintCount(0);
  }

  function start() {
    const pool0 = selWords(tsel);
    const n = cnt==="all" ? pool0.length : +cnt;
    const pool = shuf(pool0).slice(0, Math.min(n, pool0.length));
    setQs(pool); setQi(0); setScore(0);
    initRound(pool, 0);
    setPhase("game");
  }

  function tapTile(tile) {
    if (res || tile.used) return;
    const newPicked = [...picked, { id:tile.id, ch:tile.ch }];
    setTiles(prev => prev.map(t => t.id===tile.id ? {...t, used:true} : t));
    setPicked(newPicked);
    // auto-check when enough letters placed
    const answer = getAnswer(qs[qi]);
    if (newPicked.length === answer.length) {
      const typed = newPicked.map(p=>p.ch).join("");
      const ok = norm(typed) === norm(answer);
      setRes(ok ? "ok" : "bad");
      if (ok) setScore(s=>s+1);
      rec(qs[qi][0], 'tile', ok);
    }
  }

  function removeLast() {
    if (res || picked.length===0) return;
    const last = picked[picked.length-1];
    setTiles(prev => prev.map(t => t.id===last.id ? {...t, used:false} : t));
    setPicked(prev => prev.slice(0,-1));
  }

  function hint() {
    if (res) return;
    const answer = getAnswer(qs[qi]);
    const nextPos = hintCount; // reveal this index
    if (nextPos >= answer.length) return;
    const neededCh = answer[nextPos];
    // Remove any wrong picked letters beyond nextPos first
    // Clear everything and re-reveal up to nextPos+1
    const newHint = nextPos + 1;
    // Find tile ids that match needed chars in order
    const needed = answer.slice(0, newHint).split("");
    const used = [];
    const newTiles = tiles.map(t => ({...t, used:false}));
    const newPicked = [];
    for (const ch of needed) {
      const tile = newTiles.find(t => !t.used && norm(t.ch)===norm(ch));
      if (tile) { tile.used = true; used.push(tile); newPicked.push({id:tile.id, ch:tile.ch}); }
    }
    setTiles(newTiles);
    setPicked(newPicked);
    setHintCount(newHint);
    // auto-check if complete
    if (newHint === answer.length) {
      const ok = true;
      setRes("ok");
      setScore(s=>s+1);
      rec(qs[qi][0], 'tile', ok);
    }
  }

  function next() {
    const nextQi = qi+1;
    if (nextQi >= qs.length) { setPhase("result"); return; }
    setQi(nextQi);
    initRound(qs, nextQi);
  }

  function retry() {
    // Reset the current word without counting as new attempt
    initRound(qs, qi);
  }

  // ── setup screen ──
  if (phase==="setup") return (
    <div>
      <TopicPicker sel={tsel} setSel={setTsel} />
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:"1rem" }}>
        <MCard title="English → Greek letters" on={mode==="gr"} onClick={()=>setMode("gr")}/>
        <MCard title="English → Transcription" on={mode==="tr"} onClick={()=>setMode("tr")}/>
      </div>
      <div style={{ display:"flex", alignItems:"center", gap:8, justifyContent:"center", marginBottom:"1rem" }}>
        <span style={{ fontSize:13, color:"#888" }}>Words:</span>
        <select value={cnt} onChange={e=>setCnt(e.target.value)} style={{ padding:"4px 8px", border:"0.5px solid #ccc", borderRadius:8, background:"transparent", fontSize:13, fontFamily:"inherit" }}>
          {(()=>{
            const total = selWords(tsel).length;
            const opts = ["10","20","30","50","75","100","150","all"];
            return opts.filter(v => v==="all" || Number(v) <= total)
              .map(v=><option key={v} value={v}>{v==="all" ? `all (${total})` : v}</option>);
          })()}
        </select>
      </div>
      <div style={{ textAlign:"center" }}><Btn onClick={start}>Start →</Btn></div>
    </div>
  );
  if (phase==="result") return <ResBox score={score} total={qs.length} onRetry={()=>{
    const reshuffled = shuf([...qs]);
    setQs(reshuffled); setQi(0); setScore(0);
    initRound(reshuffled, 0);
    setPhase("game");
  }}/>;

  // ── game screen ──
  const w = qs[qi];
  const answer = getAnswer(w);
  const slots = answer.length;
  const bgMain = res==="ok" ? "#E1F5EE" : res==="bad" ? "#FFF0F0" : "#f7f7ff";
  const accentColor = res==="ok" ? "#1D9E75" : res==="bad" ? "#E24B4A" : "#534AB7";

  return (
    <div style={{ background:bgMain, borderRadius:16, padding:"1.2rem", transition:"background .3s" }}>
      {/* progress */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"1rem" }}>
        <button onClick={()=>setPhase("setup")} style={{ fontSize:13, color:"#888", background:"none", border:"none", cursor:"pointer", fontFamily:"inherit", padding:0 }}>← Back</button>
        <span style={{ fontSize:13, color:"#888" }}>{qi+1}/{qs.length}</span>
        <Pill>{score} correct</Pill>
      </div>
      <Bar pct={Math.round((qi+1)/qs.length*100)} h={4}/>
      <div style={{ marginBottom:"1.4rem" }}/>

      {/* question */}
      <div style={{ position:"relative", textAlign:"center", border:"0.5px solid #e0e0e0", borderRadius:12, padding:"1.2rem 1rem 1rem", marginBottom:"1.2rem", background:"white" }}>
        <WordStatsBadge mastery={mastery} greekWord={w[0]} compact style={{ position:"absolute", top:10, right:12 }} />
        <button
          onClick={e=>{ e.stopPropagation(); setShowDetail(true); }}
          style={{ position:"absolute", top:10, left:12, padding:"3px 9px", borderRadius:14, border:"0.5px solid #7F77DD", background:"#EEEDFE", color:"#3C3489", fontSize:11, cursor:"pointer", fontFamily:"inherit" }}>
          📖 More
        </button>
        <div style={{ fontSize:26, fontWeight:600, color:"#222", marginBottom:4 }}>{getQuestion(w)}</div>
        <div style={{ fontSize:12, color:"#aaa" }}>{mode==="gr" ? "Spell in Greek" : "Write transcription"}</div>
      </div>

      {/* answer slots */}
      <div style={{ display:"flex", flexWrap:"wrap", gap:6, justifyContent:"center", minHeight:52, marginBottom:"1.2rem", padding:"8px 0" }}>
        {Array.from({length:slots}).map((_,i) => {
          const p = picked[i];
          const isHinted = i < hintCount;
          return (
            <div key={i} onClick={()=>{ if(p && !res && !isHinted){ setTiles(prev=>prev.map(t=>t.id===p.id?{...t,used:false}:t)); setPicked(prev=>prev.filter((_,pi)=>pi!==i)); }}}
              style={{ minWidth:38, height:44, borderRadius:8, border:`2px solid ${p ? accentColor : "#ccc"}`, background: p ? (isHinted?"#FFF3CD":accentColor==="rgb(29,158,117)"?"#E1F5EE":"white") : "white", display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, fontWeight:600, color: p ? accentColor : "#ddd", cursor: p&&!isHinted&&!res?"pointer":"default", transition:"all .15s", padding:"0 6px" }}>
              {p ? p.ch : ""}
            </div>
          );
        })}
      </div>

      {/* feedback */}
      {res && (
        <div style={{ textAlign:"center", marginBottom:"1rem" }}>
          <div style={{ fontSize:14, fontWeight:500, color:accentColor }}>
            {res==="ok" ? "✓ Correct!" : `✗ Answer: ${answer}`}
          </div>
        </div>
      )}

      {/* tile keyboard */}
      {!res && (
        <div style={{ display:"flex", flexWrap:"wrap", gap:8, justifyContent:"center", marginBottom:"1.2rem" }}>
          {tiles.map(tile => (
            <button key={tile.id} onClick={()=>tapTile(tile)} disabled={tile.used}
              style={{ minWidth:44, height:52, borderRadius:10, border:"1.5px solid #ccc", background:tile.used?"#eee":"white", color:tile.used?"#ccc":"#222", fontSize:20, fontWeight:600, cursor:tile.used?"default":"pointer", fontFamily:"inherit", transition:"all .12s", padding:"0 8px", boxShadow:tile.used?"none":"0 2px 4px rgba(0,0,0,0.08)" }}>
              {tile.ch}
            </button>
          ))}
        </div>
      )}

      {/* action buttons */}
      <div style={{ display:"flex", gap:8, justifyContent:"center" }}>
        {!res ? (
          <>
            <button onClick={removeLast} style={{ padding:"10px 18px", borderRadius:10, border:"1.5px solid #ccc", background:"white", fontSize:13, cursor:"pointer", fontFamily:"inherit" }}>⌫ Delete</button>
            <button onClick={hint} disabled={hintCount>=slots}
              style={{ padding:"10px 18px", borderRadius:10, border:"1.5px solid #BA7517", background:"#FFF3CD", color:"#7A4F00", fontSize:13, cursor:hintCount>=slots?"default":"pointer", fontFamily:"inherit", display:"flex", alignItems:"center", gap:5 }}>
              💡 Hint ({slots-hintCount} left)
            </button>
          </>
        ) : res==="bad" ? (
          <>
            <button onClick={retry}
              style={{ padding:"12px 24px", borderRadius:10, border:"1.5px solid #BA7517", background:"#FFF3CD", color:"#7A4F00", fontSize:14, fontWeight:600, cursor:"pointer", fontFamily:"inherit" }}>
              ↺ Retry
            </button>
            <button onClick={next}
              style={{ padding:"12px 24px", borderRadius:10, border:"none", background:"#ccc", color:"white", fontSize:14, fontWeight:600, cursor:"pointer", fontFamily:"inherit" }}>
              Skip →
            </button>
          </>
        ) : (
          <button onClick={next}
            style={{ padding:"12px 32px", borderRadius:10, border:"none", background:accentColor, color:"white", fontSize:15, fontWeight:600, cursor:"pointer", fontFamily:"inherit" }}>
            Next →
          </button>
        )}
      </div>
      {showDetail && <CardDetail word={w} onClose={()=>setShowDetail(false)}/>}
    </div>
  );
}

const CR_NOUNS = [

  { t:"ж. -ση/-ξη", g:"ж", re:/(ση|ξη|ψη|^πολη)$/, p:1, f:[["η πόλ","η"],["της πόλ","ης"],["τη πόλ","η"],["οι πόλ","εις"],["των πόλ","εων"],["τις πόλ","εις"]] },
  { t:"ж. -η",  g:"ж", re:/η$/,   f:[["η φίλ","η"],["της φίλ","ης"],["τη φίλ","η"],["οι φίλ","ες"],["των φίλ","ων"],["τις φίλ","ες"]] },
  { t:"ср. -ο", g:"ср", re:/ο$/,  f:[["το βιβλί","ο"],["του βιβλί","ου"],["το βιβλί","ο"],["τα βιβλί","α"],["των βιβλί","ων"],["τα βιβλί","α"]] },

const CR_COLKEYS = ["nom","gen","acc","nom","gen","acc"];
function crStripAccents(x){ return (x||"").normalize("NFD").replace(/[̀-ͯ]/g,""); }
function crInfo(caseLabel, gender, nounBase) {
  const lbl = caseLabel || "";
  const ck = /Род/.test(lbl) ? "gen" : /Вин/.test(lbl) ? "acc" : /Ном/.test(lbl) ? "nom" : null;
  const pl = /мн/.test(lbl);
  const art = ((nounBase||"").match(/^(ο|η|το)\s/)||[])[1];
  const g = gender || (art==="ο"?"м":art==="η"?"ж":art==="το"?"ср":null);
  const gi = g==="м"?0 : g==="ж"?1 : g==="ср"?2 : null;
  const word = crStripAccents((nounBase||"").replace(/^(ο|η|το)\s+/,"").trim()).replace(/ς$/,"σ");
  let ni = -1;
  if (word) {
    // -μα before -α; only rows of the same gender (so neuter -ος / feminine -ος don't land on "м. -ος")
    const order = CR_NOUNS.map((r,i)=>i).sort((a,b)=>(CR_NOUNS[b].p||0)-(CR_NOUNS[a].p||0));

// Correct article for each gender / case / number — used to check the model's answer key
const CS_ARTICLE = {
  "ο":  { acc:{ sg:["τον","το"], pl:["τους"] }, gen:{ sg:["του"], pl:["των"] } },
  "η":  { acc:{ sg:["την","τη"], pl:["τις"] },  gen:{ sg:["της"], pl:["των"] } },
  "το": { acc:{ sg:["το"],       pl:["τα"] },   gen:{ sg:["του"], pl:["των"] } },
};
// σε + accusative article merge into one word — the blank may stand for the merged form
const CS_SE_FORM = { "τον":"στον", "την":"στην", "τη":"στη", "το":"στο", "τους":"στους", "τις":"στις", "τα":"στα" };
const CS_SE_ALL = ["στον","στην","στο","στους","στις","στα"];
const CS_LABEL = { acc:{ sg:"Вин. ед.", pl:"Вин. мн." }, gen:{ sg:"Род. ед.", pl:"Род. мн." } };

// Each case × number combination appears once per cycle; nouns rotate ο → η → το so genders stay balanced
function planCaseSlots(nouns, cases, n, articleOf) {
  const byG = { "ο":[], "η":[], "το":[] };
  nouns.forEach(w => { const a = articleOf(w); if (byG[a]) byG[a].push(w); });
  const genders = ["ο","η","το"].filter(g => byG[g].length);
  const queues = {}; genders.forEach(g => queues[g] = []);
  const combos = [];
  cases.forEach(c => ["sg","pl"].forEach(num => combos.push({ cs:c, num })));
  const slots = []; let cycle = []; let gi = Math.floor(Math.random() * genders.length);
  while (slots.length < n && genders.length) {
    if (!cycle.length) cycle = shuf([...combos]);
    const g = genders[gi++ % genders.length];
    if (!queues[g].length) queues[g] = shuf([...byG[g]]);
    slots.push({ ...cycle.shift(), gender: g, noun: queues[g].shift() });
  }
  return slots;
}

// Does a declined noun form fit gender (ο/η/το) + case + number? Ending-based, accent-insensitive (ς→σ).
// Catches e.g. "των αστρολογίας" (article plural, noun still singular).
function caseFormFits(form, gender, cs, num) {
  const f = grNorm(String(form || "").trim().split(/\s+/).pop());
  if (!f) return false;
  if (cs === "gen" && num === "pl") return /ων$/.test(f);                       // every gender: -ων / -ών
  if (/ων$/.test(f)) return false;                                               // -ων is only genitive plural
  if (cs === "gen") return gender === "ο" ? /(ου|α|η|ε)$/.test(f)               // φίλου, άντρα, μαθητή
                         : gender === "η" ? /σ$/.test(f)                         // γυναίκας, φίλης, πόλης
                         : /(ου|οσ|ουσ)$/.test(f);                               // βιβλίου, παιδιού, μαθήματος, λάθους
  if (num === "pl") return gender === "το" ? (/(α|η)$/.test(f) && (!/μα$/.test(f) || /ματα$/.test(f)))
                                           : /(ουσ|εσ|εισ|αδεσ|ηδεσ)$/.test(f);
  // accusative singular
  return gender === "το" ? !/ματα$/.test(f) && !/(ια|εσ|ουσ)$/.test(f)
                         : !/σ$/.test(f);
}

  const prev = wordBeforeBlank(q.gr);
  if (CS_ARTICLE_WORDS.has(prev)) return false;                          // "στις ___ ακρόπολη" — double article
  if (prev === "σε" || prev === "σ") return false;                       // "σε ___": σε must be merged into the blank (στον, στην…)
  const gov = q.governor || {};

    if (CS_ACC_PREPS.has(prev)) return false;                             // από / για / με … + genitive
    if (type && !["possession", "preposition_gen"].includes(type)) return false;

function validateCaseSlots(raw, slots) {
  const out = [];
  raw.forEach((q, i) => {
    const slot = slots[(q && Number.isInteger(q.n) ? q.n - 1 : i)];
    if (!slot || !q || q.skip) return;                                   // model: unnatural in this number → refilled with another noun
    if (!validateCasesSentencesV2([q], [slot.cs]).length) return;       // format checks (one blank, options, …)
    if (grNorm(q.noun_base || "") !== grNorm(slot.noun[0])) return;     // the requested noun
    const plain = CS_ARTICLE[slot.gender][slot.cs][slot.num];
    const allowed = slot.cs === "acc" ? [...plain, ...plain.map(a => CS_SE_FORM[a])] : plain;
    const ans = String(q.article_answer).trim();
    if (!allowed.includes(ans)) return;                                   // article matches gender + case + number
    const isSe = ans.startsWith("στ");
    if (isSe) {
      // options are rebuilt in code: the answer + 3 other σε-forms (στην/στη count as one)
      const same = a => a === ans || (["στη","στην"].includes(a) && ["στη","στην"].includes(ans));
      q = { ...q, article_options: shuf([ans, ...shuf(CS_SE_ALL.filter(a => !same(a))).slice(0, 3)]) };
    } else if ((q.article_options || []).some(a => String(a).startsWith("στ"))) return; // mixed plain / σε options
    if (!caseFormFits(q.noun_form, slot.gender, slot.cs, slot.num)) return; // noun form matches case + number too
    if (!caseGovernorOk(q, slot.cs)) return;                              // the case is actually required here
    const opts = (q.noun_form_options || []).map(o => grNorm(o));
    if (new Set(opts).size !== opts.length) return;                       // no duplicate answer options
    const unknown = unknownWords(q.gr, [q.noun_form, q.noun_base]);
    if (unknown.length > 1) return;
    out.push({ ...q, case_label: CS_LABEL[slot.cs][slot.num], gender: slot.gender==="ο"?"м":slot.gender==="η"?"ж":"ср",
               cs: slot.cs, num: slot.num, unknown });
  });
  return out;
}

// Batches of 10, 3 in parallel; failed case × number × gender slots are re-requested with other nouns (2 more rounds)
async function fetchCaseSentencesPlanned(slots, anchors, nounsByGender) {
  let out = [];
  let pending = slots;
  for (let round = 0; round < 4 && pending.length; round++) {
    const batches = [];
    for (let i = 0; i < pending.length; i += 10) batches.push(pending.slice(i, i + 10));
    const got = [];
    for (let i = 0; i < batches.length; i += 3) {
      const res = await Promise.all(batches.slice(i, i + 3).map(b => fetchCaseSlotBatch(b, anchors)));
      res.forEach(r => { if (r) got.push(...r); });
      if (!got.length && !out.length && __grammarFetchErr && ["nokey","http"].includes(__grammarFetchErr.kind)) return null;
    }
    out = out.concat(got);
    const done = {};
    got.forEach(q => { const k = q.cs + q.num + q.gender; done[k] = (done[k] || 0) + 1; });
    const gRu = g => g==="ο"?"м":g==="η"?"ж":"ср";
    const missing = [];
    pending.forEach(sl => { const k = sl.cs + sl.num + gRu(sl.gender); if (done[k]) done[k]--; else missing.push(sl); });
    pending = missing.map(sl => { const pool = nounsByGender[sl.gender]; return { ...sl, noun: pool[Math.floor(Math.random() * pool.length)] }; });
  }
  if (out.length) __grammarFetchErr = null;
  return out.length ? out : null;
}

// Large requests (20–100) are split into batches of 10, 3 in parallel
async function fetchCasesSentences(nouns, count=10, cases=["acc","gen"], anchors=[]) {
  const BATCH = 10;
  if (count <= BATCH) return fetchCasesBatch(nouns, count, cases, anchors);
  const sizes = [];
  for (let i = 0; i < count; i += BATCH) sizes.push(Math.min(BATCH, count - i));
  let out = [];
  for (let i = 0; i < sizes.length; i += 3) {
    const res = await Promise.all(sizes.slice(i, i + 3).map(n => fetchCasesBatch(nouns, n, cases, anchors)));
    res.forEach(r => { if (r && r.length) out = out.concat(r); });
    if (!out.length && __grammarFetchErr && ["nokey","http"].includes(__grammarFetchErr.kind)) break;
  }
  if (out.length) __grammarFetchErr = null;
  return out.length ? out.slice(0, count) : null;
}

// Turn one line of model markdown into {text, kind} for the "?" explanation box; null = skip line
function mdLine(line) {
  let t = line.trim();
  if (!t || /^-{3,}$/.test(t) || /^\|?[\s\-:|]+\|?$/.test(t)) return null;      // hr / table separator
  let kind = "text";
  if (/^#{1,6}\s/.test(t)) { kind = "head"; t = t.replace(/^#{1,6}\s+/, ""); }
  if (/^\|.*\|$/.test(t)) t = t.slice(1, -1).split("|").map(c => c.trim()).filter(Boolean).join("  ·  ");
  if (/^[-•]\s/.test(t)) t = "• " + t.slice(2);
  t = t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1$2");                          // *italic* → plain
  return { text: t, kind };
}

function grNorm(x){ return (x||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ς/g,"σ"); }
let __knownStems = null;
function getKnownStems() {
  if (__knownStems) return __knownStems;
  const stems = new Set();
  const add = (entry) => {
    String(entry||"").replace(/^(ο|η|το|οι|τα)\s+/,"").split(/[\s\/,()]+/).forEach(tok => {
      const t = grNorm(tok).replace(/[^α-ω]/g,"");
      if (t.length < 2) return;
      // stem = word minus a 2-letter ending, 3..6 letters (γεμιζω → γεμι, βλεπω → βλε)
      stems.add(t.slice(0, Math.min(6, Math.max(3, t.length - 2))));
    });
  };
  WORDS.forEach(w => add(w[0]));
  if (typeof VERBS_CORE !== "undefined") VERBS_CORE.forEach(v => add(v[0]));
  __knownStems = stems;
  return stems;
}
// Words in a Greek sentence that are not in the user's dictionary (blank and focus noun ignored)
function unknownWords(gr, ignore=[]) {
  const stems = getKnownStems();
  const skip = new Set(ignore.map(grNorm));
  const out = [];
  for (const raw of (gr||"").replace(/___/g," ").split(/[\s.,;!?«»"'·:()\-–—]+/)) {
    const t = grNorm(raw).replace(/[^α-ω]/g,"");
    if (t.length < 2 || GR_FUNCTION_WORDS.has(t) || skip.has(t)) continue;
    let ok = false;
    const minN = t.length >= 6 ? 4 : 3;   // long words need a 4+ letter stem match
    for (let n = Math.min(6, t.length); n >= minN; n--) { if (stems.has(t.slice(0, n))) { ok = true; break; } }
    if (!ok) out.push(raw);
  }
  return out;
}
// Context vocabulary sent to the model: words from the chosen topics + adjectives + core verbs
function contextVocab(nouns, max=180, anchors=[]) {
  const topics = new Set([...nouns, ...anchors].map(w => w[3]));
  const fromTopics = WORDS.filter(w => topics.has(w[3]));
  const adjs = WORDS.filter(w => w[3] === "Adjectives");
  const verbs = (typeof VERBS_CORE !== "undefined" ? VERBS_CORE : []).map(v => [v[0]]);
  const pick = [...shuf(anchors).slice(0, 40), ...shuf(fromTopics).slice(0, 90), ...shuf(adjs).slice(0, 30), ...verbs.slice(0, 60)];
  const seen = new Set(); const words = [];
  for (const w of pick) { const g = w[0]; if (!seen.has(g)) { seen.add(g); words.push(g); } if (words.length >= max) break; }
  return words.join(", ");
}

function validateCasesSentencesV2(sentences, cases=["acc","gen"]) {
  return sentences.filter(q => {
    const lbl = (q && q.case_label) || "";
    if (/Ном/i.test(lbl)) return false;
    if (!cases.includes("acc") && /Вин/i.test(lbl)) return false;
    if (!cases.includes("gen") && /Род/i.test(lbl)) return false;
    if (!q || !q.gr || !q.article_answer || !q.noun_form) return false;
    // must have exactly one blank in the sentence
    if ((q.gr.match(/___/g)||[]).length !== 1) return false;
    // article options must include answer, 4 options
    if (!q.article_options || !q.article_options.includes(q.article_answer) || q.article_options.length < 2) return false;
    // noun form options must include the correct form
    if (!q.noun_form_options || !q.noun_form_options.includes(q.noun_form) || q.noun_form_options.length < 2) return false;
    // sentence must not end with the blank
    const afterBlank = q.gr.split("___")[1] || "";
    if (afterBlank.trim() === "" || afterBlank.trim() === "." || afterBlank.trim() === ";" || afterBlank.trim() === "!") return false;
    // the declined noun must follow the blank (it is swapped for the base form until answered)
    if (!afterBlank.includes(q.noun_form) || !q.noun_base) return false;
    return true;
  });
}
