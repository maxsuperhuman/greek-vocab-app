        }
      }
      if (!allRows.length) { setLoadErr("Could not load conjugations. Check API key."); return; }
      setDrillRows(shuf(allRows));
      setDrillIdx(0); setDrillInput(""); setDrillResult(null);
      setDrillScore({ok:0,total:0});
      setDrillAllTenses(true);
      setScreen("study_drill");
    }

    return (
      <div style={{padding:"0.5rem 0"}}>
        <button onClick={()=>setScreen("menu")} style={{fontSize:13,color:"#888",background:"none",border:"none",cursor:"pointer",fontFamily:"inherit",padding:0,marginBottom:12}}>← Back</button>

        {/* Verb header + tense navigation */}
        <div style={{textAlign:"center",marginBottom:"1.2rem"}}>
          <div style={{fontSize:22,fontWeight:700,color:"#26215C"}}>{selVerb[0]}</div>
          <div style={{fontSize:13,color:"#888",marginBottom:8}}>{selVerb[1]} · {selVerb[2]}</div>

          {/* Tense arrow switcher */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:12}}>
            <button onClick={()=>prevTense&&switchTense(prevTense.id)}
              disabled={!prevTense||loading}
              style={{width:34,height:34,borderRadius:"50%",border:"1.5px solid #ddd",background:prevTense?"white":"#f5f5f5",
                color:prevTense?"#534AB7":"#ccc",fontSize:18,cursor:prevTense?"pointer":"default",fontFamily:"inherit",
                display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}>‹</button>

            <div style={{minWidth:140,textAlign:"center"}}>
              {loading ? (
                <div style={{fontSize:13,color:"#888"}}>⏳ Loading…</div>
              ) : (
                <>
                  <div style={{fontSize:15,fontWeight:700,color:"#534AB7"}}>{tenseInfo.label}</div>
                  <div style={{fontSize:12,color:"#9D96D8"}}>{tenseInfo.grLabel}</div>
                </>
              )}
            </div>

            <button onClick={()=>nextTense&&switchTense(nextTense.id)}
              disabled={!nextTense||loading}
              style={{width:34,height:34,borderRadius:"50%",border:"1.5px solid #ddd",background:nextTense?"white":"#f5f5f5",
                color:nextTense?"#534AB7":"#ccc",fontSize:18,cursor:nextTense?"pointer":"default",fontFamily:"inherit",
                display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}>›</button>
          </div>

          {/* Tense dots */}
          <div style={{display:"flex",justifyContent:"center",gap:6,marginTop:8}}>
            {TENSES_LIST.map((t,i) => (
              <button key={t.id} onClick={()=>switchTense(t.id)}
                style={{width:8,height:8,borderRadius:"50%",border:"none",padding:0,cursor:"pointer",
                  background:t.id===selTense?"#534AB7":"#ddd",transition:"background .2s"}}/>
            ))}
          </div>
        </div>

        {loadErr && <div style={{color:"#E24B4A",fontSize:13,marginBottom:10,textAlign:"center"}}>{loadErr}</div>}

        {!loading && conjTable && (
          <div style={{background:"#EEEDFE",borderRadius:14,padding:"14px 16px",marginBottom:"1.2rem"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:15}}>
              <tbody>
                {conjTable.rows.map((r,i) => (
                  <tr key={i} style={{borderBottom:i<conjTable.rows.length-1?"1px solid rgba(83,74,183,0.15)":undefined}}>
                    <td style={{padding:"9px 6px 9px 0",color:"#888",fontSize:13,width:"36%"}}>{r.person}</td>
                    <td style={{padding:"9px 6px",fontWeight:600,color:"#26215C"}}>{r.form}</td>
                    <td style={{padding:"9px 0 9px 4px",color:"#9D96D8",fontSize:13,fontStyle:"italic"}}>{r.tr}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}

        <div style={{display:"flex",gap:10,marginTop:"0.5rem"}}>
          <button onClick={()=>{
            const rows = shuf([...conjTable.rows]);
            setDrillRows(rows.map(r=>({...r,tenseLabel:tenseInfo.label,tenseGr:tenseInfo.grLabel})));
            setDrillIdx(0); setDrillInput(""); setDrillResult(null);
            setDrillScore({ok:0,total:0});
            setDrillAllTenses(false);
            setScreen("study_drill");
          }}
            disabled={loading||!conjTable}
            style={{flex:1,padding:"12px 10px",borderRadius:12,border:"1.5px solid #534AB7",background:"white",
              color:"#534AB7",fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
            Drill this tense
          </button>
          <button onClick={startDrillAllTenses}
            disabled={loading}
            style={{flex:1,padding:"12px 10px",borderRadius:12,border:"none",background:"#534AB7",
              color:"white",fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
            Drill all 3 →
          </button>
        </div>
      </div>
    );
  }

  // ── STUDY DRILL: type each person's form ──
  if (screen === "study_drill") {
    if (drillIdx >= drillRows.length) {
      // finished
      return (
        <div style={{padding:"2rem 0",textAlign:"center"}}>
          <div style={{fontSize:32,marginBottom:8}}>🎉</div>
          <div style={{fontSize:18,fontWeight:700,color:"#26215C",marginBottom:4}}>
            {drillScore.ok}/{drillRows.length} correct
          </div>
          <div style={{fontSize:13,color:"#888",marginBottom:"1.5rem"}}>
            {selVerb[0]} · {drillAllTenses ? "All 3 tenses" : (TENSES_LIST.find(t=>t.id===selTense)?.label)}
          </div>
          <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
            <button onClick={()=>{
              setDrillRows(shuf([...drillRows])); setDrillIdx(0); setDrillInput(""); setDrillResult(null);
              setDrillScore({ok:0,total:0});
            }}
              style={{padding:"11px 22px",borderRadius:12,border:"2px solid #534AB7",background:"white",color:"#534AB7",fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
              🔁 Retry
            </button>
            <button onClick={()=>setScreen("study_tense")}
              style={{padding:"11px 22px",borderRadius:12,border:"none",background:"#534AB7",color:"white",fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
              ← Back to table
            </button>
            <button onClick={()=>setScreen("menu")}
              style={{padding:"11px 22px",borderRadius:12,border:"1px solid #ddd",background:"white",color:"#888",fontSize:14,cursor:"pointer",fontFamily:"inherit"}}>
              Change verb
            </button>
          </div>
        </div>
      );
    }

    const row = drillRows[drillIdx];
    const bgMain = drillResult==="ok" ? "#E8F8F2" : drillResult==="bad" ? "#FFF0F0" : "white";

    function submitDrill() {
      if (drillResult) return;
      const ok = norm(drillInput) === norm(row.form);
      setDrillResult(ok ? "ok" : "bad");
      setDrillScore(s => ({ ok: s.ok+(ok?1:0), total: s.total+1 }));
    }

    return (
      <div style={{background:bgMain,borderRadius:16,padding:"1.2rem",transition:"background .3s",minHeight:360}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem"}}>
          <button onClick={()=>setScreen("study_tense")} style={{fontSize:13,color:"#888",background:"none",border:"none",cursor:"pointer",fontFamily:"inherit",padding:0}}>← Table</button>
          <span style={{fontSize:12,color:"#aaa"}}>{drillIdx+1}/{drillRows.length}</span>
          <span style={{fontSize:12,color:"#1D9E75",fontWeight:500}}>{drillScore.ok} ✓</span>
        </div>
        <Bar pct={Math.round((drillIdx)/drillRows.length*100)} h={4}/>
        <div style={{marginBottom:"1.4rem"}}/>

        <div style={{textAlign:"center",marginBottom:"1.6rem"}}>
          <div style={{fontSize:11,color:"#aaa",textTransform:"uppercase",letterSpacing:".06em",marginBottom:6}}>
            {row.tenseLabel || TENSES_LIST.find(t=>t.id===selTense)?.label} · {row.tenseGr || TENSES_LIST.find(t=>t.id===selTense)?.grLabel}
          </div>
          <div style={{fontSize:14,color:"#888",marginBottom:4}}>{selVerb[0]} = {selVerb[2]}</div>
          <div style={{fontSize:28,fontWeight:700,color:"#26215C"}}>{row.person}</div>
          <div style={{fontSize:13,color:"#9D96D8",marginTop:2}}>{
            DRILL_PERSONS.find(p=>p.gr===row.person)?.en || ""
          }</div>
        </div>

        <div style={{marginBottom:"1rem"}}>
          <input
            ref={inputRef}
            value={drillInput}
            onChange={e=>setDrillInput(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter"){ if(drillResult){ setDrillIdx(i=>i+1); setDrillInput(""); setDrillResult(null); } else submitDrill(); } }}
            disabled={!!drillResult}
            placeholder="Type the Greek form…"
            autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false"
            style={{width:"100%",padding:"14px",fontSize:18,fontWeight:500,borderRadius:12,
              border:`2px solid ${drillResult==="ok"?"#1D9E75":drillResult==="bad"?"#E24B4A":"#ddd"}`,
              background:"white",fontFamily:"inherit",outline:"none",textAlign:"center",boxSizing:"border-box"}}
          />
        </div>

        {drillResult && (
          <div style={{textAlign:"center",marginBottom:"1rem",fontSize:15,fontWeight:600,
            color:drillResult==="ok"?"#1D9E75":"#E24B4A"}}>
            {drillResult==="ok" ? "✓ Correct!" : `✗ Answer: ${row.form}`}
            {drillResult==="ok" && <div style={{fontSize:13,color:"#9D96D8",fontWeight:400,marginTop:2}}>{row.tr}</div>}
          </div>
        )}

        <div style={{textAlign:"center"}}>
          {!drillResult ? (
            <button onClick={submitDrill}
              style={{padding:"12px 40px",borderRadius:12,border:"none",background:"#534AB7",color:"white",fontSize:15,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
              Check ✓
            </button>
          ) : (
            <button onClick={()=>{ setDrillIdx(i=>i+1); setDrillInput(""); setDrillResult(null); setTimeout(()=>inputRef.current&&inputRef.current.focus(),50); }}
              style={{padding:"12px 40px",borderRadius:12,border:"none",
                background:drillResult==="ok"?"#1D9E75":"#E24B4A",
                color:"white",fontSize:15,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
              Next →
            </button>
          )}
        </div>
      </div>
    );
  }

  // ── TEST GAME: fill in the blank ──
  if (screen === "test_game") {
    if (testIdx >= testExs.length) {
      // results
      return (
        <div style={{padding:"2rem 0",textAlign:"center"}}>
          <div style={{fontSize:32,marginBottom:8}}>🎉</div>
          <div style={{fontSize:18,fontWeight:700,color:"#26215C",marginBottom:4}}>
            {testScore.ok}/{testExs.length} correct
          </div>
          <div style={{fontSize:13,color:"#888",marginBottom:"1.5rem"}}>{testVerb[0]} · fill-in-the-blank</div>
          <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
            <button onClick={()=>{
              setTestIdx(0); setTestInput(""); setTestResult(null);
              setTestScore({ok:0,total:0});
              setTestExs(s=>shuf([...s]));
            }}
              style={{padding:"11px 22px",borderRadius:12,border:"2px solid #1D9E75",background:"white",color:"#1D9E75",fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
              🔁 Retry
            </button>
            <button onClick={()=>setScreen("menu")}
              style={{padding:"11px 22px",borderRadius:12,border:"none",background:"#534AB7",color:"white",fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
              ← New verb
            </button>
          </div>
        </div>
      );
    }

    const ex = testExs[testIdx];
    const bgMain = testResult==="ok" ? "#E8F8F2" : testResult==="bad" ? "#FFF0F0" : "white";

    function submitTest() {
      if (testResult) return;
      const ok = norm(testInput) === norm(ex.answer);
      setTestResult(ok ? "ok" : "bad");
      setTestScore(s=>({ok:s.ok+(ok?1:0),total:s.total+1}));
    }

    return (
      <div style={{background:bgMain,borderRadius:16,padding:"1.2rem",transition:"background .3s",minHeight:400}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem"}}>
          <button onClick={()=>setScreen("menu")} style={{fontSize:13,color:"#888",background:"none",border:"none",cursor:"pointer",fontFamily:"inherit",padding:0}}>← Menu</button>
          <span style={{fontSize:12,color:"#aaa"}}>{testIdx+1}/{testExs.length}</span>
          <span style={{fontSize:12,color:"#1D9E75",fontWeight:500}}>{testScore.ok} ✓</span>
        </div>
        <Bar pct={Math.round(testIdx/testExs.length*100)} h={4}/>
        <div style={{marginBottom:"1.4rem"}}/>

        <div style={{textAlign:"center",marginBottom:"1.6rem"}}>
          <div style={{fontSize:11,color:"#aaa",textTransform:"uppercase",letterSpacing:".06em",marginBottom:6}}>
            Fill in the blank · {ex.tense} · {ex.person}
          </div>
          <div style={{fontSize:11,color:"#888",marginBottom:4,fontStyle:"italic"}}>{testVerb[0]} = {testVerb[2]}</div>
          {/* Russian translation */}
          <div style={{fontSize:18,fontWeight:600,color:"#26215C",marginBottom:12,lineHeight:1.4}}>
            {ex.ru}
          </div>
          {/* Greek sentence with blank */}
          <div style={{fontSize:20,fontWeight:500,color:"#444",lineHeight:1.6,background:"rgba(83,74,183,0.07)",borderRadius:10,padding:"10px 16px"}}>
            {ex.gr_before && <span>{ex.gr_before} </span>}
            <span style={{borderBottom:"2px solid #534AB7",padding:"0 12px",color:"#534AB7",fontWeight:700,minWidth:60,display:"inline-block",textAlign:"center"}}>
              {testResult ? ex.answer : "___"}
            </span>
            {ex.gr_after && <span> {ex.gr_after}</span>}
          </div>
          {testResult && (
            <div style={{marginTop:6,fontSize:13,color:"#9D96D8",fontStyle:"italic"}}>{ex.tr}</div>
          )}
        </div>

        <div style={{marginBottom:"1rem"}}>
          <input
            value={testInput}
            onChange={e=>setTestInput(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter"){ if(testResult){ setTestIdx(i=>i+1); setTestInput(""); setTestResult(null); } else submitTest(); } }}
            disabled={!!testResult}
            placeholder="Type the verb form in Greek…"
            autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false"
            style={{width:"100%",padding:"14px",fontSize:18,fontWeight:500,borderRadius:12,
              border:`2px solid ${testResult==="ok"?"#1D9E75":testResult==="bad"?"#E24B4A":"#ddd"}`,
              background:"white",fontFamily:"inherit",outline:"none",textAlign:"center",boxSizing:"border-box"}}
          />
        </div>

        {testResult && (
          <div style={{textAlign:"center",marginBottom:"1rem",fontSize:15,fontWeight:600,
            color:testResult==="ok"?"#1D9E75":"#E24B4A"}}>
            {testResult==="ok" ? "✓ Correct!" : `✗ Answer: ${ex.answer}`}
          </div>
        )}

        <div style={{textAlign:"center"}}>
          {!testResult ? (
            <button onClick={submitTest}
              style={{padding:"12px 40px",borderRadius:12,border:"none",background:"#1D9E75",color:"white",fontSize:15,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
              Check ✓
            </button>
          ) : (
            <button onClick={()=>{ setTestIdx(i=>i+1); setTestInput(""); setTestResult(null); }}
              style={{padding:"12px 40px",borderRadius:12,border:"none",
                background:testResult==="ok"?"#1D9E75":"#E24B4A",
                color:"white",fontSize:15,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
              Next →
            </button>
          )}
        </div>
      </div>
    );
  }

  return null;
}

// ─── Stats Tab ─────────────────────────────────────────────────────
function StatsTab({ mastery }) {
  const [filter, setFilter] = useState("all");
  const [, forceUpdate] = useState(0);

  // Apply decay on render
  const m = useMemo(() => applyDecay(mastery), [mastery]);

  const items = WORDS.map(w => {
    const e = m[w[0]] || initMastery()[w[0]];
    const lvl = e.level;
    const modes = e.modes;
    const totalOk   = Object.values(modes).reduce((a,x)=>a+x.ok,0);
    const totalFail = Object.values(modes).reduce((a,x)=>a+x.fail,0);
    const totalAtt  = totalOk + totalFail;
    const acc = totalAtt ? Math.round(totalOk/totalAtt*100) : null;
    return { w, e, lvl, totalOk, totalFail, totalAtt, acc };
  });

  const counts = [0,1,2,3,4,5].map(l => items.filter(i=>i.lvl===l).length);
  const frozen = items.filter(i=>i.e.frozen).length;
  const mastPct = Math.round((counts[5]+frozen)/WORDS.length*100);

  const visible = items
    .filter(i => filter==="all" || (filter==="5"?i.lvl===5:filter==="frozen"?i.e.frozen:i.lvl===+filter))
    .sort((a,b) => a.lvl!==b.lvl ? a.lvl-b.lvl : (a.acc??-1)-(b.acc??-1));

  return (
    <div>
      {/* level legend */}
      <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:"1rem" }}>
        {LEVEL_INFO.map((li,i) => (
          <div key={i} style={{ display:"flex", alignItems:"center", gap:4, padding:"3px 8px", borderRadius:20, background:li.bg, border:`0.5px solid ${li.color}` }}>
            <span style={{ fontSize:12, color:li.color }}>{li.icon}</span>
            <span style={{ fontSize:11, color:li.color, fontWeight:500 }}>{li.label}</span>
            <span style={{ fontSize:11, color:li.color }}>({counts[i]})</span>
          </div>
        ))}
        {frozen>0&&<div style={{ display:"flex", alignItems:"center", gap:4, padding:"3px 8px", borderRadius:20, background:"#FFD700", border:"0.5px solid #B8860B" }}><span style={{fontSize:11,color:"#7A5900",fontWeight:500}}>❄ Frozen ({frozen})</span></div>}
      </div>

      {/* overall progress */}
      <div style={{ marginBottom:"1.4rem" }}>
        <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, marginBottom:5 }}>
          <span style={{ fontWeight:500 }}>Overall mastery</span>
          <span style={{ color:"#888" }}>{counts[5]+frozen}/{WORDS.length} ({mastPct}%)</span>
        </div>
        {/* segmented bar */}
        <div style={{ height:12, borderRadius:6, overflow:"hidden", display:"flex", background:"#eee" }}>
          {LEVEL_INFO.map((li,i) => {
            const w = counts[i]/WORDS.length*100;
            if (w===0) return null;
            return <div key={i} style={{ width:`${w}%`, height:12, background:li.color, transition:"width .3s" }} title={`${li.label}: ${counts[i]}`}/>;
          })}
        </div>
        <div style={{ display:"flex", justifyContent:"space-between", fontSize:10, color:"#aaa", marginTop:3 }}>
          <span>Level 0 (unseen)</span><span>{mastPct}% mastered</span><span>Level 5 ★</span>
        </div>
      </div>

      {/* what's next hint */}
      {counts[0]>0&&<div style={{ background:"#f7f7ff", border:"0.5px solid #AFA9EC", borderRadius:10, padding:"10px 14px", marginBottom:"1rem", fontSize:12, color:"#534AB7" }}>
        💡 <strong>{counts[0]}</strong> words unseen — start with Flashcards to unlock level 1!
      </div>}
      {counts[4]>0&&<div style={{ background:"#E1F5EE", border:"0.5px solid #5DCAA5", borderRadius:10, padding:"10px 14px", marginBottom:"1rem", fontSize:12, color:"#0F6E56" }}>
        🎯 <strong>{counts[4]}</strong> words at level 4 — one more full round to reach level 5!
      </div>}

      {/* filter chips */}
      <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:"1rem", alignItems:"center" }}>
        <span style={{ fontSize:12, color:"#888", fontWeight:500 }}>Show:</span>
        {[["all","All"], ["0","Unseen"], ["1","Lv1"], ["2","Lv2"], ["3","Lv3"], ["4","Lv4"], ["5","Mastered"]].map(([v,l])=>(
          <Chip key={v} label={`${l} (${v==="all"?WORDS.length:counts[+v]??0})`} on={filter===v} onClick={()=>setFilter(v)}/>
        ))}
      </div>

      {/* word list */}
      {visible.length===0
        ? <div style={{ textAlign:"center", padding:"2rem", color:"#888", fontSize:13 }}>No words here yet</div>
        : <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
            {visible.map(({w,e,lvl,totalOk,totalAtt,acc})=>{
              const li = lv(lvl);
              const ms = e.modes;
              return (
                <div key={w[0]} style={{ padding:"10px 12px", background:li.bg, borderRadius:10, border:`0.5px solid ${li.color}33` }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
                    <span style={{ fontSize:16, color:li.color }}>{li.icon}</span>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:14, fontWeight:600, color:"#222" }}>{w[0]}</div>
                      <div style={{ fontSize:11, color:"#888", fontStyle:"italic" }}>{w[1]} · {w[2]}</div>
                    </div>
                    <div style={{ textAlign:"right" }}>
                      <div style={{ fontSize:11, fontWeight:600, color:li.color }}>{li.label}</div>
                      {acc!==null&&<div style={{ fontSize:10, color:"#aaa" }}>{totalOk}/{totalAtt} · {acc}%</div>}
                      {e.frozen&&<div style={{ fontSize:10, color:"#B8860B" }}>❄ frozen</div>}
                    </div>
                  </div>
                  {/* mode progress pills */}
                  <div style={{ display:"flex", gap:5, flexWrap:"wrap" }}>
                    {[
                      { key:"flash",      label:"Flash" },
                      { key:"quiz_gr_en", label:"Quiz GR→EN" },
                      { key:"quiz_en_gr", label:"Quiz EN→GR" },
                      { key:"tile",       label:"Spelling" },
                    ].map(({key,label})=>{
                      const md = ms[key];
                      const tot = md.ok+md.fail;
                      const pct = tot ? Math.round(md.ok/tot*100) : null;
                      const done = md.cleared;
                      return (
                        <div key={key} style={{ padding:"2px 7px", borderRadius:10, fontSize:10, fontWeight:500, background:done?"#1D9E75":tot>0?"#FFF3CD":"#eee", color:done?"white":tot>0?"#7A4F00":"#bbb", border:`0.5px solid ${done?"#1D9E75":tot>0?"#BA7517":"#ddd"}` }}>
                          {done?"✓ ":""}{label}{pct!==null?` ${pct}%`:""}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
      }

      {/* Clear cache */}
      <div style={{ marginTop:"2rem", paddingTop:"1rem", borderTop:"0.5px solid #eee" }}>
        <div style={{ fontSize:12, color:"#aaa", marginBottom:8 }}>App maintenance</div>
        <button onClick={async () => {
          if (!confirm("Clear app cache? Your progress is safe.")) return;
          try {
            await caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k))));
            if (navigator.serviceWorker) {
              const regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(r => r.unregister()));
            }
            alert("Cache cleared! Reloading…");

</div>
<details class="stress"><summary>🔊 Ударение и приращение ε- <small>почему έγραψα, но γράψαμε · θα γράψω без ε</small></summary>
<div class="rulebox"><strong>Главное правило аориста:</strong> ударение всегда на <b>3-м слоге от конца</b>. Считай слоги с конца слова: раз, два, <b>три</b>.</div>
<h3>1 · Откуда берётся ε- (приращение, αύξηση)</h3>
<p>Если в форме аориста всего <b>2 слога</b>, третьего слога «от конца» нет. Тогда спереди добавляется <b>ε-</b>, и ударение падает на него:</p>
<div class="cmp"><span class="sy"><b>γρά</b><i>·</i>ψα</span><span class="ar">2 слога → нужен 3-й</span><span class="sy"><b>έ</b><i>·</i>γρα<i>·</i>ψα</span></div>
<div class="cmp"><span class="sy"><b>φύ</b><i>·</i>γα</span><span class="ar">→</span><span class="sy"><b>έ</b><i>·</i>φυ<i>·</i>γα</span></div>
<div class="cmp"><span class="sy"><b>κά</b><i>·</i>να</span><span class="ar">→</span><span class="sy"><b>έ</b><i>·</i>κα<i>·</i>να</span></div>
<p>Если слогов и так 3 и больше, ε- <b>не нужно</b>: <span class="sy">α<i>·</i><b>γό</b><i>·</i>ρα<i>·</i>σα</span>, <span class="sy"><b>μί</b><i>·</i>λη<i>·</i>σα</span>, <span class="sy"><b>διά</b><i>·</i>βα<i>·</i>σα</span>.</p>
<h3>2 · «Сильные» (длинные) окончания двигают ударение</h3>
<p>У окончаний <b>-αμε</b> и <b>-ατε</b> по два слога. Правило «3-й от конца» остаётся тем же, поэтому ударение сдвигается вправо, к концу слова. А если ударение ушло с ε-, то <b>ε- исчезает</b>, потому что оно существует только под ударением:</p>
<div class="pt"><div class="pt-t">γράφω → аорист (2-сложная основа: ε- только под ударением)</div><div class="table-wrap"><table class="par"><tr><th></th><th>Αόριστος</th></tr><tr><td class='pl'>εγώ</td><td><span class="sy"><b>έ</b><i>·</i>γρα<i>·</i>ψα</span></td></tr><tr><td class='pl'>εσύ</td><td><span class="sy"><b>έ</b><i>·</i>γρα<i>·</i>ψες</span></td></tr><tr><td class='pl'>αυτός</td><td><span class="sy"><b>έ</b><i>·</i>γρα<i>·</i>ψε</span></td></tr><tr><td class='pl'>εμείς</td><td><span class="sy"><b>γρά</b><i>·</i>ψα<i>·</i>με</span></td></tr><tr><td class='pl'>εσείς</td><td><span class="sy"><b>γρά</b><i>·</i>ψα<i>·</i>τε</span></td></tr><tr><td class='pl'>αυτοί</td><td><span class="sy"><b>έ</b><i>·</i>γρα<i>·</i>ψαν</span></td></tr></table></div></div>
<div class="pt"><div class="pt-t">αγοράζω · μιλάω → аорист (длинная основа: ε- не нужно, ударение «ездит»)</div><div class="table-wrap"><table class="par"><tr><th></th><th>αγοράζω</th><th>μιλάω</th></tr><tr><td class='pl'>εγώ</td><td><span class="sy">α<i>·</i><b>γό</b><i>·</i>ρα<i>·</i>σα</span></td><td><span class="sy"><b>μί</b><i>·</i>λη<i>·</i>σα</span></td></tr><tr><td class='pl'>εσύ</td><td><span class="sy">α<i>·</i><b>γό</b><i>·</i>ρα<i>·</i>σες</span></td><td><span class="sy"><b>μί</b><i>·</i>λη<i>·</i>σες</span></td></tr><tr><td class='pl'>αυτός</td><td><span class="sy">α<i>·</i><b>γό</b><i>·</i>ρα<i>·</i>σε</span></td><td><span class="sy"><b>μί</b><i>·</i>λη<i>·</i>σε</span></td></tr><tr><td class='pl'>εμείς</td><td><span class="sy">α<i>·</i>γο<i>·</i><b>ρά</b><i>·</i>σα<i>·</i>με</span></td><td><span class="sy">μι<i>·</i><b>λή</b><i>·</i>σα<i>·</i>με</span></td></tr><tr><td class='pl'>εσείς</td><td><span class="sy">α<i>·</i>γο<i>·</i><b>ρά</b><i>·</i>σα<i>·</i>τε</span></td><td><span class="sy">μι<i>·</i><b>λή</b><i>·</i>σα<i>·</i>τε</span></td></tr><tr><td class='pl'>αυτοί</td><td><span class="sy">α<i>·</i><b>γό</b><i>·</i>ρα<i>·</i>σαν</span></td><td><span class="sy"><b>μί</b><i>·</i>λη<i>·</i>σαν</span></td></tr></table></div></div>
<p>3-е лицо мн. числа имеет и второй вариант на <b>-ανε</b>, тоже без ε-: <span class="sy"><b>γρά</b><i>·</i>ψα<i>·</i>νε</span>, <span class="sy">α<i>·</i>γο<i>·</i><b>ρά</b><i>·</i>σα<i>·</i>νε</span>.</p>
<h3>3 · Будущее и υποτακτική: ε- нет никогда</h3>
<p>θα / να + основа аориста <b>без приращения</b>. Ударение здесь не «ездит», а стоит на одном месте во всех лицах:</p>
<div class="pt"><div class="pt-t">θα + основа аориста</div><div class="table-wrap"><table class="par"><tr><th></th><th>γράφω</th><th>μιλάω</th></tr><tr><td class='pl'>εγώ</td><td><span class="sy"><span class="tha">θα</span> <b>γρά</b><i>·</i>ψω</span></td><td><span class="sy"><span class="tha">θα</span> μι<i>·</i><b>λή</b><i>·</i>σω</span></td></tr><tr><td class='pl'>εσύ</td><td><span class="sy"><span class="tha">θα</span> <b>γρά</b><i>·</i>ψεις</span></td><td><span class="sy"><span class="tha">θα</span> μι<i>·</i><b>λή</b><i>·</i>σεις</span></td></tr><tr><td class='pl'>αυτός</td><td><span class="sy"><span class="tha">θα</span> <b>γρά</b><i>·</i>ψει</span></td><td><span class="sy"><span class="tha">θα</span> μι<i>·</i><b>λή</b><i>·</i>σει</span></td></tr><tr><td class='pl'>εμείς</td><td><span class="sy"><span class="tha">θα</span> <b>γρά</b><i>·</i>ψου<i>·</i>με</span></td><td><span class="sy"><span class="tha">θα</span> μι<i>·</i><b>λή</b><i>·</i>σου<i>·</i>με</span></td></tr><tr><td class='pl'>εσείς</td><td><span class="sy"><span class="tha">θα</span> <b>γρά</b><i>·</i>ψε<i>·</i>τε</span></td><td><span class="sy"><span class="tha">θα</span> μι<i>·</i><b>λή</b><i>·</i>σε<i>·</i>τε</span></td></tr><tr><td class='pl'>αυτοί</td><td><span class="sy"><span class="tha">θα</span> <b>γρά</b><i>·</i>ψουν</span></td><td><span class="sy"><span class="tha">θα</span> μι<i>·</i><b>λή</b><i>·</i>σουν</span></td></tr></table></div></div>
<div class="cmp"><span class="sy"><b>έ</b><i>·</i>γρα<i>·</i>ψα</span><span class="ar">χτες · αύριο</span><span class="sy"><span class="tha">θα</span> <b>γρά</b><i>·</i>ψω</span></div>
<h3>4 · Особые случаи приращения</h3><ul>
<li><b>ή- вместо έ-</b> у нескольких частых глаголов: <span class="sy"><b>ή</b><i>·</i>θε<i>·</i>λα</span> (θέλω), <span class="sy"><b>ή</b><i>·</i>ξε<i>·</i>ρα</span> (ξέρω), <span class="sy"><b>ή</b><i>·</i>πια</span> (πίνω). Во мн. числе ή- тоже уходит: <span class="sy"><b>θέ</b><i>·</i>λα<i>·</i>με</span>, <span class="sy"><b>ξέ</b><i>·</i>ρα<i>·</i>με</span>, но <span class="sy"><b>ή</b><i>·</i>πια<i>·</i>με</span> сохраняет.</li>
<li><b>Неправильные</b> держат свою первую гласную во всех лицах: <span class="sy"><b>εί</b><i>·</i>χα</span> → <span class="sy"><b>εί</b><i>·</i>χα<i>·</i>με</span>, <span class="sy"><b>εί</b><i>·</i>δα</span> → <span class="sy"><b>εί</b><i>·</i>δα<i>·</i>με</span>, <span class="sy"><b>εί</b><i>·</i>πα</span> → <span class="sy"><b>εί</b><i>·</i>πα<i>·</i>με</span>.</li>
<li><b>Внутреннее приращение</b> у «книжных» глаголов с приставкой: ε- встаёт после приставки: <span class="sy">ε<i>·</i><b>πέ</b><i>·</i>στρε<i>·</i>ψα</span> (επιστρέφω), <span class="sy">ε<i>·</i><b>ξέ</b><i>·</i>φρα<i>·</i>σα</span> (εκφράζω), <span class="sy">δι<i>·</i><b>έ</b><i>·</i>κο<i>·</i>ψα</span> (διακόπτω), <span class="sy">α<i>·</i><b>πέ</b><i>·</i>κτη<i>·</i>σα</span> (αποκτώ), <span class="sy">πα<i>·</i><b>ρήγ</b><i>·</i>γει<i>·</i>λα</span> (παραγγέλνω).</li>
<li>В <b>повелительном</b> приращения тоже нет: <span class="sy"><b>γρά</b><i>·</i>ψε</span>, <span class="sy"><b>γρά</b><i>·</i>ψτε</span>.</li></ul>
<h3>5 · Ударение в настоящем времени</h3><ul>
<li><b>Τύπος Α</b>: ударение стоит на месте: <span class="sy"><b>γρά</b><i>·</i>φω</span>, <span class="sy"><b>γρά</b><i>·</i>φου<i>·</i>με</span>, <span class="sy"><b>γρά</b><i>·</i>φουν</span>.</li>
<li><b>Β1 / Β2</b>: ударение на окончании: <span class="sy">μι<i>·</i><b>λά</b><i>·</i>ω</span>, <span class="sy">μι<i>·</i><b>λάς</b></span>, <span class="sy">μι<i>·</i><b>λά</b><i>·</i>με</span> · <span class="sy">μπο<i>·</i><b>ρώ</b></span>, <span class="sy">μπο<i>·</i><b>ρεί</b><i>·</i>τε</span>.</li>
<li><b>Γ1 / Γ2</b>: то же правило 3-го слога. Длинные окончания -όμαστε, -όσαστε, -ούνται тянут ударение вправо: <span class="sy"><b>έρ</b><i>·</i>χο<i>·</i>μαι</span> → <span class="sy">ερ<i>·</i><b>χό</b><i>·</i>μα<i>·</i>στε</span> · <span class="sy">θυ<i>·</i><b>μά</b><i>·</i>μαι</span> → <span class="sy">θυ<i>·</i><b>μό</b><i>·</i>μα<i>·</i>στε</span>, <span class="sy">θυ<i>·</i><b>μού</b><i>·</i>νται</span>.</li></ul>
<div class="pt"><div class="pt-t">Аорист на -θηκα (Γ1/Γ2): тоже 3-й слог от конца</div><div class="table-wrap"><table class="par"><tr><th></th><th>γεννιέμαι</th></tr><tr><td class='pl'>εγώ</td><td><span class="sy">γεν<i>·</i><b>νή</b><i>·</i>θη<i>·</i>κα</span></td></tr><tr><td class='pl'>εσύ</td><td><span class="sy">γεν<i>·</i><b>νή</b><i>·</i>θη<i>·</i>κες</span></td></tr><tr><td class='pl'>αυτός</td><td><span class="sy">γεν<i>·</i><b>νή</b><i>·</i>θη<i>·</i>κε</span></td></tr><tr><td class='pl'>εμείς</td><td><span class="sy">γεν<i>·</i>νη<i>·</i><b>θή</b><i>·</i>κα<i>·</i>με</span></td></tr><tr><td class='pl'>εσείς</td><td><span class="sy">γεν<i>·</i>νη<i>·</i><b>θή</b><i>·</i>κα<i>·</i>τε</span></td></tr><tr><td class='pl'>αυτοί</td><td><span class="sy">γεν<i>·</i><b>νή</b><i>·</i>θη<i>·</i>καν</span></td></tr></table></div></div>
<div class="rulebox" style="border-left-color:var(--n,#2e8b57)"><strong>Как проверить себя:</strong> аорист → считай 3 слога с конца. Если не хватает, добавь ε-. Если окончание длинное (-αμε, -ατε, -ήκαμε), ударение сдвигается, и ε- пропадает. В будущем (θα) ε- никогда нет.</div>
</details>

function CheatsheetModal({ resource, onClose }) {
  // Close on backdrop click
  function onBackdrop(e) { if (e.target === e.currentTarget) goBack(); }
  // Prevent body scroll while open
  React.useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { document.body.style.overflow = prev; };
  }, []);
  // Phone back gesture / browser Back and Esc close the sheet instead of leaving the app
  const onCloseRef = React.useRef(onClose);
  onCloseRef.current = onClose;
  React.useEffect(() => {
    try { history.pushState({ cheatsheet: true }, ""); } catch(e) {}
    const onPop = () => onCloseRef.current();
    const onKey = (e) => { if (e.key === "Escape") goBack(); };
    window.addEventListener("popstate", onPop);
    window.addEventListener("keydown", onKey);
    return () => { window.removeEventListener("popstate", onPop); window.removeEventListener("keydown", onKey); };
  }, []);
  function goBack() {
    // pop our history entry (fires popstate → onClose); fall back to closing directly
    if (history.state && history.state.cheatsheet) history.back(); else onCloseRef.current();
  }
  return (
    <div onClick={onBackdrop} style={{
      position:"fixed", inset:0, zIndex:9999,
      background:"rgba(0,0,0,0.5)", display:"flex", flexDirection:"column",
      alignItems:"stretch"
    }}>
      <div style={{
        display:"flex", alignItems:"center", justifyContent:"space-between",
        background:"#fff", borderBottom:"1px solid #e2ddd6",
        padding:"8px 12px", flexShrink:0, gap:10
      }}>
        <button onClick={goBack} style={{
          display:"flex", alignItems:"center", gap:4, flexShrink:0,
          padding:"7px 12px", borderRadius:10, border:"1px solid #d3c6ec", background:"#f3effa",
          color:"#3C3489", fontSize:14, fontWeight:600, cursor:"pointer", fontFamily:"inherit"
        }}>← Назад</button>
        <div style={{ flex:1, minWidth:0, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
          <span style={{ fontSize:14, fontWeight:600, color:"#1a1714" }}>{resource.title}</span>
          <span style={{ marginLeft:8, fontSize:11, fontWeight:600, textTransform:"uppercase",
            background:resource.color, color:"#fff", borderRadius:5, padding:"1px 7px" }}>
            {resource.tag}
          </span>
        </div>
        <button onClick={goBack} aria-label="Закрыть" style={{
          fontSize:22, lineHeight:1, background:"none", border:"none",
          cursor:"pointer", color:"#888", padding:"0 4px", flexShrink:0
        }}>×</button>
      </div>
      <iframe
        srcDoc={resource.html}
        style={{ flex:1, border:"none", background:"#faf9f6" }}
        sandbox="allow-same-origin"
      />
    </div>
  );
}

function AuditTab() {
  const [results, setResults] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const [fixing, setFixing] = React.useState(false);
  const [fixLog, setFixLog] = React.useState([]);

  // Greek noun articles — ο/η/το typically precede nouns in dictionary form
  const NOUN_ARTICLE_RE = /^(ο|η|το)\s+/i;
  // Verb check — Greek verbs in 1st person present end in -ω/-ώ/-αω/-εί etc
  const VERB_1ST_RE = /[ωώ]$|ώ$|άω$|ιέμαι$|ούμαι$|άμαι$/;
  // Adjective typically ends in -ος/-η/-ο or -ής/-ές
  const ADJ_RE = /ος$|ή$|ο$|ής$|ές$|ός$/;

  function analyse() {
    setLoading(true);
    const issues = [];

    WORDS.forEach((w, idx) => {
      const [gr, tr, en, topic, subtopic] = w;
      const rowId = `#${idx+1} "${gr}"`;

      if (topic === "Verbs") {
        // Verbs: should NOT start with an article
        if (NOUN_ARTICLE_RE.test(gr)) {
          issues.push({ idx, kind:"verb-has-article", gr, en, topic, subtopic,
            msg: `Verb starts with article: "${gr}"` });
        }
        // Should end in -ω/-ώ (1st person singular present = dictionary form)
        const bare = gr.replace(/^(να|μην)\s+/i,"").trim();
        if (!VERB_1ST_RE.test(bare)) {
          issues.push({ idx, kind:"verb-not-infinitive", gr, en, topic, subtopic,
            msg: `Verb may not be in 1st-person present form: "${gr}"` });
        }
        // English should start with "to " or "I "
        if (!/^(to |I |he |she )/i.test(en)) {
          issues.push({ idx, kind:"verb-en-form", gr, en, topic, subtopic,
            msg: `Verb English translation doesn't start with "to/I": "${en}"` });
        }
      }

      if (topic === "Nouns" || (!["Verbs","Adjectives","Adverbs","Conjunctions","Prepositions","Pronouns","Numbers","Phrases"].includes(topic) && !VERB_1ST_RE.test(gr) && !ADJ_RE.test(gr) && !NOUN_ARTICLE_RE.test(gr) && gr.split(" ").length === 1)) {
        // single-word, not a known verb/adj/etc — might be a noun missing article
        // but only flag if topic hints it's a noun
      }

      // Nouns (any topic that's not Verbs/Adjectives/etc): check article
      const isLikelyNoun = !["Verbs","Adjectives","Adverbs","Conjunctions","Prepositions","Pronouns","Numbers"].includes(topic);
      if (isLikelyNoun && !VERB_1ST_RE.test(gr) && !ADJ_RE.test(gr)) {
        const bare = gr.trim();
        if (!NOUN_ARTICLE_RE.test(bare) && !bare.includes(" ") && bare.length > 2) {
          // single word, not clearly a verb or adjective, no article
          issues.push({ idx, kind:"noun-no-article", gr, en, topic, subtopic,
            msg: `Possible noun missing article: "${gr}" (${en})` });
        }
      }

      // Check for duplicate entries
      const dupes = WORDS.filter((x,i) => i !== idx && x[0] === gr);
      if (dupes.length > 0 && idx === WORDS.findIndex(x=>x[0]===gr)) {
        issues.push({ idx, kind:"duplicate", gr, en, topic, subtopic,
          msg: `Duplicate entry: "${gr}" appears ${dupes.length+1} times` });
      }

      // Transliteration present?
      if (!tr || tr.trim() === "") {
        issues.push({ idx, kind:"missing-tr", gr, en, topic, subtopic,
          msg: `Missing transliteration for "${gr}"` });
      }

      // English missing?
      if (!en || en.trim() === "") {
        issues.push({ idx, kind:"missing-en", gr, en, topic, subtopic,
          msg: `Missing English for "${gr}"` });
      }
    });

    // Group by kind
    const grouped = {};
    issues.forEach(issue => {
      if (!grouped[issue.kind]) grouped[issue.kind] = [];
      grouped[issue.kind].push(issue);
    });

    setResults({ issues, grouped, total: WORDS.length });
    setLoading(false);
  }

  async function fixWithClaude(kind) {
    const apiKey = await getApiKey();
    if (!apiKey) { alert("Enter API key first"); return; }
    const subset = results.grouped[kind] || [];
    if (!subset.length) return;
    setFixing(true);
    const log = [];

    // Only auto-fix things we're confident about
    if (kind === "verb-en-form") {
      const items = subset.map(i => `${i.gr} — current EN: "${i.en}"`).join("\n");
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body: JSON.stringify({ model:"claude-haiku-4-5", max_tokens:1000,
          messages:[{ role:"user", content:
`For each Greek verb below, provide the correct English translation starting with "to " (infinitive form).
Return ONLY a JSON array of {"gr":"...","en":"..."} objects, one per verb.

${items}`
          }]
        })
      });
      const data = await res.json();
      try {
        const fixes = JSON.parse(data.content[0].text.match(/\[[\s\S]*\]/)[0]);
        fixes.forEach(f => { log.push(`Fixed "${f.gr}": → "${f.en}"`); });
        setFixLog(log);
      } catch(e) { setFixLog(["Parse error — check console"]); }
    } else {
      setFixLog(["Auto-fix not available for this issue type — fix manually in WORDS array"]);
    }
    setFixing(false);
  }

  const kindLabels = {
    "verb-has-article": "🔴 Глаголы с артиклем",
    "verb-not-infinitive": "🟠 Глаголы не в начальной форме",
    "verb-en-form": "🟡 EN перевод глагола не начинается с 'to'",
    "noun-no-article": "🔵 Существительные без артикля",
    "duplicate": "⚪ Дубликаты",
    "missing-tr": "🟣 Нет транслитерации",
    "missing-en": "🔴 Нет английского перевода",
  };

  return (
    <div style={{ padding:"1rem", maxWidth:700, margin:"0 auto" }}>
      <h2 style={{ fontSize:18, fontWeight:600, marginBottom:4 }}>Аудит словаря</h2>
      <p style={{ fontSize:13, color:"#888", marginBottom:"1.2rem" }}>
        Проверяет {WORDS.length} слов: артикли у существительных, начальная форма глаголов, дубликаты, пропуски.
      </p>
      <Btn onClick={analyse} disabled={loading}>
        {loading ? "Анализирую…" : "Запустить проверку →"}
      </Btn>

      {results && (
        <div style={{ marginTop:"1.5rem" }}>
          <div style={{ fontSize:13, color:"#555", marginBottom:"1rem" }}>
            Проверено {results.total} слов — найдено <strong>{results.issues.length}</strong> проблем
          </div>

          {results.issues.length === 0 && (
            <div style={{ color:"#085041", background:"#E1F5EE", borderRadius:10, padding:"1rem", fontSize:14 }}>
              ✅ Всё в порядке — словарь чистый!
            </div>
          )}

          {Object.entries(results.grouped).map(([kind, items]) => (
            <div key={kind} style={{ marginBottom:"1.5rem" }}>
              <div style={{ fontWeight:600, fontSize:14, marginBottom:6 }}>
                {kindLabels[kind] || kind} <span style={{ color:"#888", fontWeight:400 }}>({items.length})</span>
              </div>
              <div style={{ border:"0.5px solid #eee", borderRadius:10, overflow:"hidden" }}>
                {items.map((issue, i) => (
                  <div key={i} style={{ padding:"8px 12px", borderBottom: i<items.length-1?"0.5px solid #f0f0f0":"none", fontSize:13, display:"flex", justifyContent:"space-between", alignItems:"center", background: i%2===0?"#fafafa":"white" }}>
                    <div>
                      <span style={{ fontWeight:500, color:"#534AB7" }}>{issue.gr}</span>
                      <span style={{ color:"#aaa", margin:"0 6px" }}>·</span>
                      <span style={{ color:"#888" }}>{issue.en}</span>
                      <span style={{ color:"#aaa", margin:"0 6px" }}>·</span>
                      <span style={{ color:"#bbb", fontSize:11 }}>{issue.topic} / {issue.subtopic}</span>
                    </div>
                    <div style={{ fontSize:11, color:"#aaa", marginLeft:8, flexShrink:0 }}>#{issue.idx+1}</div>
                  </div>
                ))}
              </div>
              {kind === "verb-en-form" && (
                <button onClick={()=>fixWithClaude(kind)} disabled={fixing}
                  style={{ marginTop:6, fontSize:12, color:"#534AB7", background:"none", border:"1px solid #534AB7", borderRadius:6, padding:"4px 10px", cursor:"pointer", fontFamily:"inherit" }}>
                  {fixing ? "Исправляю…" : "Исправить через Claude →"}
                </button>
              )}
            </div>
          ))}

          {fixLog.length > 0 && (
            <div style={{ background:"#f5f5ff", border:"1px solid #e0e0ff", borderRadius:10, padding:"1rem", fontSize:12, fontFamily:"monospace", marginTop:"1rem" }}>
              {fixLog.map((l,i) => <div key={i}>{l}</div>)}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── Root ──────────────────────────────────────────────────────────
const STORAGE_KEY = "greek_vocab_mastery_v1";

function App() {
  const [tab, setTab]         = useState("dict");
  const [dictSub, setDictSub] = useState("dict");     // tile inside the Dictionary hub
  const [dictSel, setDictSel] = useState(SEL_ALL);    // topic selection shared by Dictionary / Quiz / Type / Flashcards / Fallee
  const [mastery, setMastery] = useState(initMastery);
  const [loaded, setLoaded]   = useState(false);
  const [saveStatus, setSaveStatus] = useState(null);

  // Load from Supabase on mount
  useEffect(() => {
    async function load() {
      try {
        const saved = await supabaseLoad();
        if (saved) {
          const fresh = initMastery();
          const merged = { ...fresh };
          Object.keys(saved).forEach(k => {
            if (merged[k] && saved[k]) {
              const savedModes = saved[k].modes || {};
              const mergedModes = {};
              Object.keys(merged[k].modes).forEach(m => {
                mergedModes[m] = savedModes[m]
                  ? { ok: savedModes[m].ok||0, fail: savedModes[m].fail||0, cleared: savedModes[m].cleared||false }
                  : merged[k].modes[m];
              });
              merged[k] = {
                level:    saved[k].level    ?? 0,
                streak5:  saved[k].streak5  ?? 0,
                frozen:   saved[k].frozen   ?? false,
                lastSeen: saved[k].lastSeen ?? null,
                modes: mergedModes,
              };
            }
          });
          setMastery(applyDecay(merged));
        } else {
          setMastery(applyDecay(initMastery()));
        }
      } catch {
        setMastery(applyDecay(initMastery()));
      }
      setLoaded(true);
    }
    load();
  }, []);

  // Save to Supabase on every mastery change (debounced 2s)
  useEffect(() => {
    if (!loaded) return;
    setSaveStatus("saving");
    const timer = setTimeout(async () => {
      const ok = await supabaseSave(mastery);
      setSaveStatus(ok ? "saved" : "error");
      setTimeout(() => setSaveStatus(null), 2000);
    }, 2000);
    return () => clearTimeout(timer);
  }, [mastery, loaded]);

  // rec: record an answer from any exercise
  const rec = useCallback((wordKey, mode, ok) => {
    setMastery(prev => applyAnswer(prev, wordKey, mode, ok));
  }, []);

  // Online status
  const [isOnline, setIsOnline] = useState(() => typeof navigator !== "undefined" ? navigator.onLine : true);
  const [showRestore, setShowRestore] = useState(false);
  const [restoreText, setRestoreText] = useState("");
  const [restoreMsg, setRestoreMsg] = useState(null);

  function exportBackup() {
    try {
      const data = JSON.stringify(mastery);
      // Try clipboard
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(data).then(() => {
          setRestoreMsg({ ok:true, text:"✓ Copied! Paste into Notes app to save." });
          setTimeout(()=>setRestoreMsg(null), 4000);
        }).catch(()=> showTextFallback(data));
      } else {
        showTextFallback(data);
      }
    } catch(e) {
      setRestoreMsg({ ok:false, text:"Could not export." });
    }
  }

  function showTextFallback(data) {
    setRestoreText(data);
    setShowRestore(true);
    setRestoreMsg({ ok:true, text:"Copy the text below and save it in Notes." });
  }

  function importBackup() {
    try {
      const saved = JSON.parse(restoreText.trim());
      const fresh = initMastery();
      const merged = { ...fresh };
      Object.keys(saved).forEach(k => {
        if (merged[k] && saved[k]) {
          const savedModes = saved[k].modes || {};
          const mergedModes = {};
          Object.keys(merged[k].modes).forEach(m => {
            mergedModes[m] = savedModes[m]
              ? { ok:savedModes[m].ok||0, fail:savedModes[m].fail||0, cleared:savedModes[m].cleared||false }
              : merged[k].modes[m];
          });
          merged[k] = { level:saved[k].level??0, streak5:saved[k].streak5??0,
            frozen:saved[k].frozen??false, lastSeen:saved[k].lastSeen??null, modes:mergedModes };
        }
      });
      setMastery(applyDecay(merged));
      setShowRestore(false);
      setRestoreText("");
      setRestoreMsg({ ok:true, text:"✓ Progress restored!" });
      setTimeout(()=>setRestoreMsg(null), 3000);
    } catch(e) {
      setRestoreMsg({ ok:false, text:"Invalid backup data. Please check and try again." });
    }
  }
  useEffect(() => {
    const on  = () => setIsOnline(true);
    const off = () => setIsOnline(false);
    window.addEventListener("online",  on);
    window.addEventListener("offline", off);
    return () => { window.removeEventListener("online", on); window.removeEventListener("offline", off); };
  }, []);

  // Derived values — ALL hooks and derived state BEFORE any early return
  const masteryArr = useMemo(() => Object.values(mastery), [mastery]);
  const level5     = masteryArr.filter(e => e.level >= 5 || e.frozen).length;
  const mastPct    = Math.round(level5/WORDS.length*100);
  const TABS = [
    { id:"dict",      label:"📚 Dictionary" },
    { id:"articles",  label:"Grammar" },
    { id:"sentences", label:"Sentences" },
    { id:"verbs",     label:"Verbs" },
    { id:"theory",    label:"📖 Theory" },
    { id:"audit",     label:"🔍 Audit" },
  ];

  // Early return only AFTER all hooks
  if (!loaded) return (
    <div style={{ padding:"3rem", textAlign:"center", color:"#888", fontFamily:"system-ui,sans-serif" }}>
      Loading your progress…
    </div>
  );

  return (
    <div style={{ fontFamily:"system-ui,sans-serif", padding:"0.5rem 0", maxWidth:720 }}>
      {/* header */}
      <div style={{ background:"#EEEDFE", border:"0.5px solid #AFA9EC", borderRadius:12, padding:"10px 16px", marginBottom:6, display:"flex", alignItems:"center", gap:12, flexWrap:"wrap" }}>
        <div>
          <div style={{ fontSize:11, fontWeight:500, color:"#534AB7", textTransform:"uppercase", letterSpacing:".06em" }}>Greek Vocabulary <span style={{fontWeight:400,color:"#9D96D8",letterSpacing:0}}>v1.86-0106</span></div>
          <div style={{ fontSize:15, fontWeight:500, color:"#26215C" }}>A1–B1 · {WORDS.length} words · {TOPICS.length-1} topics</div>
        </div>
        <div style={{ marginLeft:"auto", display:"flex", gap:6, alignItems:"center" }}>
          {!isOnline && <span style={{ fontSize:11, color:"#888", background:"#f0f0f0", border:"0.5px solid #ccc", borderRadius:10, padding:"2px 8px" }}>📵</span>}
          {saveStatus && <span style={{ fontSize:11, color:saveStatus==="saved"?"#1D9E75":"#aaa" }}>{saveStatus==="saving"?"💾":"✓"}</span>}
          <button onClick={()=>setTab("stats")} style={{ fontSize:12, color:"#0F6E56", background:"#E1F5EE", border:"0.5px solid #5DCAA5", borderRadius:10, padding:"2px 8px", cursor:"pointer", fontFamily:"inherit" }}>★ {level5}/{WORDS.length} mastered</button>
          <button onClick={exportBackup}
            style={{ fontSize:12, padding:"3px 9px", borderRadius:10, border:"0.5px solid #7F77DD", background:"#EEEDFE", color:"#3C3489", cursor:"pointer", fontFamily:"inherit" }}>
            📋 Backup
          </button>
          <button onClick={()=>{ setShowRestore(r=>!r); setRestoreText(""); setRestoreMsg(null); }}
            style={{ fontSize:12, padding:"3px 9px", borderRadius:10, border:"0.5px solid #ccc", background:"transparent", color:"#888", cursor:"pointer", fontFamily:"inherit" }}>
            📥 Restore
          </button>
          <button onClick={async () => {
            if (!confirm("Clear app cache? Your progress is safe.")) return;
            try {
              await caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k))));
              if (navigator.serviceWorker) {
                const regs = await navigator.serviceWorker.getRegistrations();
                await Promise.all(regs.map(r => r.unregister()));
              }
              setRestoreMsg({ ok:true, text:"✓ Cache cleared! Reloading…" });
              setTimeout(() => location.reload(true), 1000);
            } catch(e) {
              setRestoreMsg({ ok:false, text:"Could not clear cache." });
            }
          }} style={{ fontSize:12, padding:"3px 9px", borderRadius:10, border:"0.5px solid #ccc", background:"transparent", color:"#888", cursor:"pointer", fontFamily:"inherit" }}>
            🗑️ Cache
          </button>
          <button onClick={async () => {
            // Remove words added on this device (IndexedDB "custom_words"); built-in dictionary and progress stay
            const custom = await loadCustomWords();
            if (!custom.length) {
              setRestoreMsg({ ok:true, text:`Добавленных вручную слов нет — словарь уже стандартный (${BASE_WORDS_COUNT} слов).` });
              setTimeout(()=>setRestoreMsg(null), 4000);
              return;
            }
            if (!confirm(`Удалить ${custom.length} слов, добавленных вручную на этом устройстве, и вернуть стандартный словарь (${BASE_WORDS_COUNT} слов)?\n\nПрогресс по словам сохранится. Отменить нельзя.`)) return;
            const ok = await saveCustomWords([]);
            if (!ok) { setRestoreMsg({ ok:false, text:"Не удалось сбросить словарь." }); return; }
            setRestoreMsg({ ok:true, text:`✓ Удалено ${custom.length} слов. Перезагружаю…` });
            setTimeout(() => location.reload(), 1000);
          }} title="Удалить слова, добавленные вручную, и вернуть стандартный словарь"
            style={{ fontSize:12, padding:"3px 9px", borderRadius:10, border:"0.5px solid #E2A0A0", background:"transparent", color:"#B04444", cursor:"pointer", fontFamily:"inherit" }}>
            ↺ Словарь
          </button>

        </div>
      </div>

      {/* Backup notification */}
      {restoreMsg && (
        <div style={{ padding:"8px 14px", borderRadius:10, marginBottom:8,
          background: restoreMsg.ok ? "#E1F5EE" : "#FCEBEB",
          border: `0.5px solid ${restoreMsg.ok ? "#5DCAA5" : "#E24B4A"}`,
          fontSize:13, color: restoreMsg.ok ? "#0F6E56" : "#E24B4A" }}>
          {restoreMsg.text}
        </div>
      )}

      {/* Restore panel */}
      {showRestore && (
        <div style={{ background:"#f8f8f8", border:"0.5px solid #ddd", borderRadius:12, padding:"14px", marginBottom:"1rem" }}>
          <div style={{ fontSize:13, fontWeight:500, marginBottom:8 }}>📥 Restore from backup</div>
          <div style={{ fontSize:12, color:"#888", marginBottom:8 }}>
            Paste your backup text here (from Notes or clipboard):
          </div>
          <textarea
            value={restoreText}
            onChange={e=>setRestoreText(e.target.value)}
            placeholder="Paste backup data here…"
            rows={4}
            style={{ width:"100%", fontSize:11, fontFamily:"monospace", padding:"8px",
              border:"0.5px solid #ccc", borderRadius:8, background:"white",
              resize:"vertical", marginBottom:8 }}
          />
          <div style={{ display:"flex", gap:8 }}>
            <button onClick={importBackup} disabled={!restoreText.trim()}
              style={{ padding:"8px 18px", borderRadius:8, border:"none",
                background: restoreText.trim() ? "#534AB7" : "#ccc",
                color:"white", fontSize:13, cursor: restoreText.trim() ? "pointer" : "default",
                fontFamily:"inherit", fontWeight:500 }}>
              Restore
            </button>
            <button onClick={()=>{ setShowRestore(false); setRestoreText(""); setRestoreMsg(null); }}
              style={{ padding:"8px 18px", borderRadius:8, border:"0.5px solid #ccc",
                background:"transparent", fontSize:13, cursor:"pointer", fontFamily:"inherit" }}>
              Cancel
            </button>
          </div>
          {restoreText && (
            <div style={{ marginTop:8, fontSize:11, color:"#aaa" }}>
              Select all text below and copy to save your backup:
            </div>
          )}
        </div>
      )}

      {/* segmented progress bar */}
      <div style={{ marginBottom:"1rem" }}>
        <div style={{ height:8, borderRadius:4, overflow:"hidden", display:"flex", background:"#eee" }}>
          {LEVEL_INFO.map((li,i) => {
            const cnt = masteryArr.filter(e=>e.level===i&&!e.frozen).length;
            if (cnt===0&&!(i===5)) return null;
            const w = (i===5 ? masteryArr.filter(e=>e.level===5||e.frozen).length : cnt) / WORDS.length * 100;
            return <div key={i} style={{ width:`${w}%`, height:8, background:li.color, transition:"width .3s" }}/>;
          })}
        </div>
        <div style={{ display:"flex", justifyContent:"space-between", fontSize:10, color:"#bbb", marginTop:3 }}>
          <span>0%</span><span>{mastPct}% mastered</span><span>100%</span>
        </div>
      </div>

      {/* tabs */}
      <div style={{ display:"flex", borderBottom:"0.5px solid #e5e5e5", marginBottom:"1rem", overflowX:"auto" }}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{ padding:"8px 13px", fontSize:13, cursor:"pointer", border:"none", background:"none", color:tab===t.id?"#111":"#888", fontFamily:"inherit", borderBottom:tab===t.id?"2px solid #111":"2px solid transparent", marginBottom:-1, fontWeight:tab===t.id?500:400, whiteSpace:"nowrap" }}>{t.label}</button>
        ))}
      </div>

      {tab==="dict"  && <DictHub mastery={mastery} rec={rec} sub={dictSub} setSub={setDictSub} tsel={dictSel} setTsel={setDictSel}/>}
      {tab==="articles" && <ArticlesTab mastery={mastery} rec={rec}/>}
      {tab==="sentences" && <SentencesTab rec={rec}/>}
      {tab==="stats"     && <StatsTab mastery={mastery}/>}
      {tab==="verbs"     && <VerbDrillTab/>}
      {tab==="theory"    && <TheoryTab/>}
      {tab==="audit"     && <AuditTab/>}
    </div>
  );
}


// Mount app
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));

  </script>
</body>
